<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover, maximum-scale=1.0">
<title>CBA篮球1v1联机</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
body{background:#0a0a15;overflow:hidden;touch-action:manipulation;font-family:-apple-system,sans-serif;width:100vw;height:100vh;height:100dvh;color:#fff}
#app{width:100%;height:100%;position:relative}
input,select,button{font-family:inherit}

/* Lobby */
#lobby{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;overflow-y:auto;z-index:10;padding:16px}
.lobby-header{text-align:center;padding:16px 0}
.lobby-header h1{font-size:26px;color:#ff8c00;letter-spacing:2px}
.lobby-header p{font-size:12px;color:#666;margin-top:4px}
.lobby-card{background:#1a1a2e;border-radius:14px;padding:16px;margin-bottom:12px}
.lobby-card h3{font-size:14px;color:#ff8c00;margin-bottom:10px}
.inp-row{display:flex;gap:8px;margin-bottom:8px}
.inp-row input{flex:1;height:40px;background:#111;border:1px solid #333;border-radius:8px;color:#fff;padding:0 12px;font-size:15px}
.inp-row button{height:40px;padding:0 16px;border-radius:8px;border:none;font-size:14px;font-weight:bold;background:#ff8c00;color:#000;white-space:nowrap}
.status-tag{display:inline-block;padding:4px 12px;border-radius:12px;font-size:11px;font-weight:bold}
.status-tag.connected{background:#0a3;color:#fff}
.status-tag.disconnected{background:#a30;color:#fff}
.status-tag.connecting{background:#aa0;color:#000}

/* Player select */
.team-scroll{display:flex;overflow-x:auto;gap:6px;padding-bottom:8px;-webkit-overflow-scrolling:touch}
.team-scroll::-webkit-scrollbar{display:none}
.t-chip{border:2px solid #333;border-radius:14px;padding:6px 12px;font-size:11px;color:#aaa;white-space:nowrap;flex-shrink:0;cursor:pointer}
.t-chip.active{color:#fff;background:#2a2a4e}
.player-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-height:200px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.p-mini{background:#222;border-radius:10px;padding:10px;cursor:pointer;border:2px solid transparent}
.p-mini.sel{border-color:#ff8c00;background:#2a2a2e}
.p-mini .pn{font-size:13px;font-weight:bold;color:#fff}
.p-mini .pi{font-size:10px;color:#888}
.p-mini .ps{display:flex;gap:4px;margin-top:4px}
.p-mini .ps span{font-size:8px;background:#333;color:#aaa;padding:1px 4px;border-radius:3px}

/* Queue */
.q-status{text-align:center;padding:20px}
.q-status .q-icon{font-size:48px}
.q-status .q-text{font-size:16px;color:#ff8c00;margin:8px 0}
.q-status .q-sub{font-size:12px;color:#888}

/* Countdown */
#countdownOverlay{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.7);display:none;align-items:center;justify-content:center;z-index:100;flex-direction:column}
#countdownOverlay.show{display:flex}
.cd-num{font-size:80px;font-weight:bold;color:#ffd700}
.cd-label{font-size:16px;color:#fff;margin-top:8px}

/* Game */
#gamePage{position:absolute;top:0;left:0;right:0;bottom:0;display:none;flex-direction:column;z-index:20}
#gameCanvas{flex:1;width:100%;display:block}
.ctrls{display:flex;justify-content:space-between;align-items:flex-end;padding:6px 10px 20px;flex-shrink:0}
.joy-wrap{display:flex;flex-direction:column;align-items:center}
.joy-base{width:90px;height:90px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.2);border-radius:50%;position:relative}
.joy-thumb{width:40px;height:40px;background:rgba(255,140,0,.5);border-radius:50%;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.joy-label{font-size:9px;color:rgba(255,255,255,.4);margin-top:3px}
.btns{display:flex;flex-direction:column;gap:6px}
.btns-row{display:flex;gap:6px;justify-content:flex-end}
.btn{width:68px;height:58px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;border:2px solid rgba(255,255,255,.12);background:rgba(255,255,255,.08);color:rgba(255,255,255,.7);transition:all .08s}
.btn:active,.btn.active{background:rgba(255,140,0,.25);border-color:#ff8c00;transform:scale(.9)}
.btn.shoot{width:90px;height:68px;background:rgba(255,68,68,.18);border-color:rgba(255,68,68,.25)}
.btn.drive{background:rgba(0,136,255,.15);border-color:rgba(0,136,255,.2)}
.btn.steal{background:rgba(255,200,0,.12);border-color:rgba(255,200,0,.2)}
.btn.block{background:rgba(255,0,0,.12);border-color:rgba(255,0,0,.2)}
.btn.foul{background:rgba(255,68,0,.15);border-color:rgba(255,68,0,.3)}
.btn .ico{font-size:22px}
.btn .lbl{font-size:9px;margin-top:1px}

/* Overlay */
.overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.75);display:none;align-items:center;justify-content:center;z-index:100}
.overlay.show{display:flex}
.ov-box{background:#1a1a2e;border-radius:20px;padding:32px 24px;text-align:center;width:300px;max-width:90vw}
.ov-box h2{font-size:22px;color:#ffd700}
.ov-box .ov-score{font-size:38px;font-weight:bold;color:#fff;margin:8px 0}
.ov-box .ov-stat{font-size:12px;color:#aaa;margin:3px 0}
.ov-box button{width:100%;height:42px;border-radius:21px;border:none;font-size:15px;font-weight:bold;margin-top:8px;padding:0}
.ov-box .ov-detail{background:linear-gradient(135deg,#ff8c00,#ff4444);color:#fff}
.ov-box .ov-again{background:rgba(255,255,255,.1);color:#ccc}

/* Event log */
.event-log{position:absolute;right:4px;top:50px;bottom:120px;width:120px;overflow:hidden;pointer-events:none;z-index:5}
.event-item{background:rgba(0,0,0,0.6);color:#fff;font-size:10px;padding:3px 6px;border-radius:4px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>
<div id="app">
  <div id="lobby"></div>
  <div id="countdownOverlay"><div class="cd-num" id="cdNum">3</div><div class="cd-label">准备开始！</div></div>
  <div id="gamePage">
    <canvas id="gameCanvas"></canvas>

        </div>
      </div>
    </div>
    <div class="overlay" id="gameOverOverlay"></div>
  </div>
</div>

var $ = function(id) { return document.getElementById(id) }

// ==================== WebSocket Client ====================
var ws = null, wsConnected = false, wsUrl = '';
var myId = '', mySide = -1, roomId = '';
var myPlayer = null, oppPlayer = null;

function getAutoUrl() {
  var proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:'
  return proto + '//' + window.location.host
}

function connectWS(url) {
  if (ws) { try { ws.close() } catch(e) {} }
  wsUrl = url || wsUrl || getAutoUrl()
  if (wsUrl.indexOf('://') === -1) wsUrl = 'ws://' + wsUrl
  ws = new WebSocket(wsUrl)
  ws.onopen = function() {
    wsConnected = true
    renderLobby()
  }
  ws.onmessage = function(e) {
    var msg = JSON.parse(e.data)
    handleMessage(msg)
  }
  ws.onclose = function() {
    wsConnected = false
    if ($('gamePage').style.display === 'flex') {
      alert('与服务器断开连接！')
      goHome()
    }
    renderLobby()
  }
  ws.onerror = function() {
    wsConnected = false
    renderLobby()
  }
}

function sendMsg(data) {
  if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(data))
}

// ==================== Message Handler ====================
var gameState = null, gameEvents = [];

function handleMessage(msg) {
  switch (msg.type) {
    case 'connected':
      myId = msg.playerId
      sendMsg({ type: 'get_leaderboard' })
      renderLobby()
      break
    case 'queued':
      updateQueueUI(msg.position)
      break
    case 'matched':
      roomId = msg.roomId; mySide = msg.side
      oppPlayer = msg.opponent
      showCountdown()
      break
    case 'jump_countdown':
      updateCountdown(msg.count)
      break
    case 'game_start':
      hideCountdown()
      startGame()
      break
    case 'state_sync':
      gameState = msg.state
      break
    case 'shot_fired':
      break
    case 'score_update':
      if (gameState) {
        gameState.sc = msg.score
        gameState.st = msg.stats
      }
      break
    case 'possession_change':
      if (gameState) {
        gameState.po = msg.poss
        gameState.sc = msg.score
      }
      break
    case 'block_result':
      break
    case 'foul_called':
      break
    case 'game_over':
      showGameOver(msg)
      break
    case 'opponent_disconnected':
      alert('对手已断开连接！')
      goHome()
      break
    case 'rematch_vote':
      break
    case 'rematch_start':
      gameState = null; gameEvents = []
      hideGameOver()
      showCountdown()
      break
    case 'leaderboard':
      window._lb = msg.data
      break
    case 'pong':
      break
  }
}

// ==================== Lobby ====================
var selTeamId = 'liaoning', selPid = '', isQueuing = false;

function getPlayers(teamId) {
  var t = CBA_TEAMS.find(function(x) { return x.id === teamId })
  return t ? t.players.map(function(p) { return Object.assign({}, p, {teamId: t.id, teamName: t.name, teamAbbr: t.abbr, teamColor: t.color}) }) : []
}

function renderLobby() {
  var h = '<div class="lobby-header"><h1>🏀 CBA篮球1v1</h1><p>手机联机对战</p></div>'

  // Server connection
  h += '<div class="lobby-card"><h3>服务器连接</h3>'
  h += '<div class="inp-row"><input id="serverInput" placeholder="输入服务器地址" value="' + (wsUrl.replace('ws://','').replace(':3456','') || '') + '">'
  h += '<button onclick="doConnect()">连接</button></div>'
  var statusClass = wsConnected ? 'connected' : (ws && ws.readyState === WebSocket.CONNECTING ? 'connecting' : 'disconnected')
  var statusText = wsConnected ? '已连接' : (ws && ws.readyState === WebSocket.CONNECTING ? '连接中...' : '未连接')
  h += '<span class="status-tag ' + statusClass + '">' + statusText + '</span>'
  h += '<span style="font-size:10px;color:#888;margin-left:8px">ID: ' + (myId || '-') + '</span>'
  h += '</div>'

  // Player select
  h += '<div class="lobby-card"><h3>选择球员</h3>'
  h += '<div class="team-scroll">'
  CBA_TEAMS.forEach(function(t) {
    h += '<div class="t-chip' + (t.id === selTeamId ? ' active' : '') + '" onclick="pickTeam(\'' + t.id + '\')" style="border-color:' + t.color + '">' + t.abbr + '</div>'
  })
  h += '</div><div class="player-grid">'
  var players = getPlayers(selTeamId)
  players.forEach(function(p) {
    h += '<div class="p-mini' + (p.id === selPid ? ' sel' : '') + '" onclick="pickPlayer(\'' + p.id + '\')">'
    h += '<div class="pn">#' + p.num + ' ' + p.name + '</div>'
    h += '<div class="pi">' + p.pos + ' | ' + p.teamAbbr + '</div>'
    h += '<div class="ps"><span>投' + p.shooting + '</span><span>速' + p.speed + '</span><span>力' + p.strength + '</span><span>防' + p.defense + '</span></div>'
    h += '</div>'
  })
  h += '</div></div>'

  // Selected player
  if (myPlayer) {
    h += '<div class="lobby-card" style="border:2px solid ' + myPlayer.teamColor + '">'
    h += '<h3>已选择: ' + myPlayer.name + ' <span style="font-size:11px;color:#888">#' + myPlayer.num + ' ' + myPlayer.teamAbbr + '</span></h3>'
    h += '<div style="display:flex;flex-wrap:wrap;gap:6px;font-size:11px">'
    h += '<span>投篮:' + myPlayer.shooting + '</span><span>速度:' + myPlayer.speed + '</span><span>力量:' + myPlayer.strength + '</span>'
    h += '<span>防守:' + myPlayer.defense + '</span><span>控球:' + myPlayer.dribbling + '</span><span>弹跳:' + myPlayer.jumping + '</span>'
    h += '</div></div>'
  }

  // Queue button
  if (isQueuing) {
    h += '<div class="lobby-card"><div class="q-status"><div class="q-icon">🔍</div><div class="q-text">正在匹配对手...</div><div class="q-sub">排队中，请稍候</div>'
    h += '<button onclick="cancelQueue()" style="height:40px;padding:0 24px;border-radius:20px;border:none;background:#a30;color:#fff;font-size:14px;margin-top:12px">取消排队</button></div></div>'
  } else {
    h += '<button onclick="joinQueue()" style="width:100%;height:50px;border-radius:25px;border:none;font-size:18px;font-weight:bold;' +
      (myPlayer && wsConnected ? 'background:linear-gradient(135deg,#ff8c00,#ff4444);color:#fff' : 'background:#333;color:#888') + '">' +
      (myPlayer && wsConnected ? '开始匹配' : (myPlayer ? '请先连接服务器' : '请选择球员')) + '</button>'
  }

  $('lobby').innerHTML = h
  // Restore input focus cursor position
  var si = $('serverInput')
  if (si && si.value === '') si.value = wsUrl.replace('ws://','').replace(':3456','')
}

function doConnect() {
  var addr = $('serverInput').value.trim()
  if (!addr) return
  if (!addr.includes(':')) addr += ':3456'
  connectWS(addr)
}

function pickTeam(id) { selTeamId = id; selPid = ''; renderLobby() }
function pickPlayer(pid) {
  selPid = pid
  var players = getPlayers(selTeamId)
  var p = players.find(function(x) { return x.id === pid })
  if (p) myPlayer = p
  renderLobby()
}

function joinQueue() {
  if (!myPlayer || !wsConnected) return
  sendMsg({
    type: 'join_queue',
    name: myPlayer.name,
    player: {
      id: myPlayer.id, name: myPlayer.name, num: myPlayer.num, pos: myPlayer.pos,
      shooting: myPlayer.shooting, speed: myPlayer.speed, strength: myPlayer.strength,
      defense: myPlayer.defense, dribbling: myPlayer.dribbling, jumping: myPlayer.jumping,
      teamColor: myPlayer.teamColor, teamAbbr: myPlayer.teamAbbr
    }
  })
  isQueuing = true
  renderLobby()
}

function cancelQueue() {
  sendMsg({ type: 'leave_queue' })
  isQueuing = false
  renderLobby()
}

function updateQueueUI(pos) {
  isQueuing = true
}

// ==================== Countdown ====================
function showCountdown() {
  $('lobby').style.display = 'none'
  $('countdownOverlay').classList.add('show')
  $('cdNum').textContent = '3'
}

function updateCountdown(count) {
  if (count > 0) {
    $('cdNum').textContent = count
  } else {
    $('cdNum').textContent = 'GO!'
  }
}

function hideCountdown() {
  $('countdownOverlay').classList.remove('show')
}

// ==================== Game ====================
var canvas, ctx, gameLoop, gameStarted = false
var myInput = { mx: 0, my: 0 }

function startGame() {
  $('lobby').style.display = 'none'
  $('gamePage').style.display = 'flex'
  $('gameOverOverlay').classList.remove('show')

  canvas = $('gameCanvas')
  ctx = canvas.getContext('2d')
  resizeCanvas()
  gameStarted = true

  if (gameLoop) clearInterval(gameLoop)
  // Send input at 30fps
  gameLoop = setInterval(function() {
    sendInput()
    renderGame()
  }, 33)
}

function resizeCanvas() {
  var rect = $('gamePage').getBoundingClientRect()
  var ctrlH = 160
  canvas.width = rect.width
  canvas.height = rect.height - ctrlH
  canvas.style.width = rect.width + 'px'
  canvas.style.height = (rect.height - ctrlH) + 'px'
}

function sendInput() {
  if (!wsConnected || !gameState) return
  sendMsg({ type: 'input', data: { action: 'move', mx: myInput.mx, my: myInput.my } })
}

// ==================== Render ====================
function renderGame() {
  if (!ctx || !canvas) return
  var w = canvas.width, h = canvas.height
  var s = gameState
  ctx.clearRect(0, 0, w, h)

  // Court
  var sc = Math.min(w / 750, h / 500)
  function _s(v) { return v * sc }
  var rx = _s(375), ry = _s(60)

  // Background
  ctx.fillStyle = '#c68642'; ctx.fillRect(0, 0, w, h)
  ctx.strokeStyle = 'rgba(180,130,80,0.2)'; ctx.lineWidth = 1
  for (var y = 0; y < h; y += _s(25)) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke() }

  // Backboard
  ctx.fillStyle = '#ddd'; ctx.fillRect(rx - _s(50), ry - _s(20), _s(100), _s(8))
  // Rim
  ctx.strokeStyle = '#ff4444'; ctx.lineWidth = 3
  ctx.beginPath(); ctx.arc(rx, ry, _s(12), 0, Math.PI * 2); ctx.stroke()
  // Net
  ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 0.5
  for (var i = 0; i < 4; i++) { ctx.beginPath(); ctx.moveTo(rx + Math.cos(-1.9 + i * 0.25) * _s(10), ry + Math.sin(-1.9 + i * 0.25) * _s(10)); ctx.lineTo(rx, ry + _s(28)); ctx.stroke() }
  // 3pt line
  var tr = _s(280)
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2
  ctx.beginPath(); ctx.arc(rx, ry, tr, Math.PI * 0.5, Math.PI * 1.5); ctx.stroke()
  // Paint
  var pw = _s(160), ph = _s(200)
  ctx.fillStyle = '#b87a3a'; ctx.fillRect(rx - pw / 2, ry, pw, ph)
  ctx.strokeStyle = '#fff'; ctx.strokeRect(rx - pw / 2, ry, pw, ph)
  ctx.beginPath(); ctx.moveTo(rx - pw / 2, ry + ph); ctx.lineTo(rx + pw / 2, ry + ph); ctx.stroke()
  // Center circle
  ctx.beginPath(); ctx.arc(rx, h - _s(20), _s(50), 0, Math.PI); ctx.stroke()

  if (!s) {
    // Waiting state
    ctx.fillStyle = '#fff'; ctx.font = 'bold ' + _s(16) + 'px sans-serif'; ctx.textAlign = 'center'
    ctx.fillText('等待对手...', w / 2, h / 2)
    return
  }

  // Draw players
  function drawPlayer(x, y, data, color, label) {
    if (!data) return
    var r = _s(25)
    var px = _s(x), py = _s(y)
    ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(px, py + r * 0.9, r * 0.8, r * 0.2, 0, 0, Math.PI * 2); ctx.fill()
    ctx.fillStyle = color; ctx.beginPath(); ctx.arc(px, py, r, 0, Math.PI * 2); ctx.fill()
    ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 2; ctx.stroke()
    ctx.fillStyle = '#fff'; ctx.font = 'bold ' + Math.floor(r * 0.7) + 'px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'
    ctx.fillText(data.num || '?', px, py)
    ctx.font = Math.floor(r * 0.4) + 'px sans-serif'
    ctx.fillText(data.name || '', px, py - r - _s(8))
    if (label) {
      ctx.fillStyle = (label === '攻' || label === '罚') ? '#ff0' : '#f88'
      ctx.font = 'bold ' + Math.floor(r * 0.4) + 'px sans-serif'
      ctx.fillText(label, px, py + r + _s(10))
    }
  }

  var p1d = mySide === 0 ? myPlayer : oppPlayer
  var p2d = mySide === 1 ? myPlayer : oppPlayer

  if (s.ph === 'freethrow') {
    var shooterIsP1 = s.fts === 0
    drawPlayer(s.p1.x, s.p1.y, p1d, '#1a6dd4', shooterIsP1 ? '罚' : '')
    drawPlayer(s.p2.x, s.p2.y, p2d, '#e03030', shooterIsP1 ? '' : '罚')
  } else {
    drawPlayer(s.p1.x, s.p1.y, p1d, '#1a6dd4', s.po === 0 ? '攻' : '守')
    drawPlayer(s.p2.x, s.p2.y, p2d, '#e03030', s.po === 1 ? '攻' : '守')
  }

  // Draw ball
  var bx = _s(s.ba.x), by = _s(s.ba.y), br = _s(10)
  if (!s.ba.ps || s.ba.ia) {
    ctx.fillStyle = '#ff8c00'; ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI * 2); ctx.fill()
    ctx.strokeStyle = '#cc6600'; ctx.lineWidth = 1.5; ctx.stroke()
    ctx.strokeStyle = '#333'; ctx.lineWidth = 1
    ctx.beginPath(); ctx.moveTo(bx - br, by); ctx.lineTo(bx + br, by); ctx.stroke()
    ctx.beginPath(); ctx.arc(bx, by, br * 0.5, 0, Math.PI * 2); ctx.stroke()
  }

  // UI Bar
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, w, _s(44))
  var p1n = p1d ? p1d.name : 'P1', p2n = p2d ? p2d.name : 'P2'
  ctx.fillStyle = '#1a6dd4'; ctx.font = 'bold ' + Math.floor(_s(12)) + 'px sans-serif'; ctx.textAlign = 'center'
  ctx.fillText(p1n, w * 0.18, _s(18))
  ctx.fillStyle = '#fff'; ctx.font = 'bold ' + Math.floor(_s(16)) + 'px sans-serif'
  ctx.fillText((s.sc ? s.sc[0] : 0) + ' - ' + (s.sc ? s.sc[1] : 0), w / 2, _s(18))
  ctx.fillStyle = '#e03030'; ctx.font = 'bold ' + Math.floor(_s(12)) + 'px sans-serif'
  ctx.fillText(p2n, w * 0.82, _s(18))
  ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.font = Math.floor(_s(10)) + 'px sans-serif'

  var phaseText = ''
  if (s.ph === 'freethrow') {
    phaseText = '罚球: ' + (s.fts === 0 ? p1n : p2n) + ' (' + (s.ftm || 0) + '/2)'
  } else if (s.ph === 'jumpball') {
    phaseText = '跳球中...'
  } else {
    phaseText = '球权: ' + (s.po === 0 ? p1n : p2n)
  }
  ctx.fillText(phaseText, w / 2, _s(34))
  ctx.fillStyle = s.cl <= 5 ? '#ff4444' : '#fff'
  ctx.font = 'bold ' + Math.floor(_s(11)) + 'px sans-serif'
  ctx.fillText((s.cl || 24) + 's', w - _s(28), _s(18))

  // 3pt line warning
  if (s.nct && !s.ctd) {
    ctx.fillStyle = '#ff0'; ctx.font = 'bold ' + Math.floor(_s(14)) + 'px sans-serif'; ctx.textAlign = 'center'
    ctx.fillText('⚠ 需运球出三分线！', w / 2, _s(65))
  }

  // Shot power bar
  if (s.sh) {
    var bw = _s(160), bh = _s(10), bx2 = w / 2 - bw / 2, by2 = h - _s(80)
    ctx.fillStyle = '#333'; ctx.fillRect(bx2, by2, bw, bh)
    ctx.fillStyle = 'rgba(0,255,0,0.3)'; ctx.fillRect(bx2 + bw * 0.45, by2, bw * 0.1, bh)
    var p = s.sp || 0, mc = '#ff0000'
    if (p >= 0.45 && p <= 0.55) mc = '#00ff00'
    else if (p >= 0.35 && p <= 0.65) mc = '#ffff00'
    ctx.fillStyle = mc; ctx.fillRect(bx2, by2, bw * p, bh)
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.strokeRect(bx2, by2, bw, bh)
    ctx.fillStyle = '#fff'; ctx.font = 'bold ' + Math.floor(_s(10)) + 'px sans-serif'; ctx.textAlign = 'center'
    ctx.fillText((s.ph === 'freethrow' ? '罚球' : '投篮') + ' 力度 ' + Math.floor(p * 100) + '%', w / 2, by2 - _s(6))
  }

  // Score popup
  if (s.san > 0 && s.spt > 0) {
    var ao = Math.min(1, s.san / 800)
    ctx.fillStyle = 'rgba(255,255,0,' + ao + ')'; ctx.font = 'bold ' + Math.floor(_s(22)) + 'px sans-serif'; ctx.textAlign = 'center'
    ctx.fillText('+' + s.spt, w / 2, _s(150))
  }

  // Foul cooldown
  if (s.fcd && s.fcd[mySide] > 0) {
    ctx.fillStyle = 'rgba(255,68,0,0.5)'; ctx.font = Math.floor(_s(10)) + 'px sans-serif'; ctx.textAlign = 'center'
    ctx.fillText('犯规冷却 ' + (s.fcd[mySide] / 1000).toFixed(1) + 's', w - _s(50), _s(60))
  }

  // Energy bars
  var ey = _s(48), eh = _s(4), ew = _s(60)
  ctx.fillStyle = '#333'; ctx.fillRect(_s(8), ey, ew, eh)
  ctx.fillStyle = '#0cf'; ctx.fillRect(_s(8), ey, ew * ((s.p1.e || 100) / 100), eh)
  ctx.fillStyle = '#333'; ctx.fillRect(w - _s(8) - ew, ey, ew, eh)
  ctx.fillStyle = '#0cf'; ctx.fillRect(w - _s(8) - ew, ey, ew * ((s.p2.e || 100) / 100), eh)

  // Events
  if (s.ev && s.ev.length > 0) {
    var el = $('eventLog')
    el.innerHTML = s.ev.map(function(t) { return '<div class="event-item">' + t + '</div>' }).join('')
  }
}

// ==================== Controls ====================
// Joystick
var joyBase = $('joyBase'), joyThumb = $('joyThumb')
var joyActive = false, joyRect = null

function getJoyRect() {
  var r = joyBase.getBoundingClientRect()
  joyRect = { cx: r.left + r.width / 2, cy: r.top + r.height / 2, mr: r.width / 2 }
}

joyBase.addEventListener('touchstart', function(e) {
  e.preventDefault(); joyActive = true; getJoyRect(); procJoy(e.touches[0])
}, { passive: false })

joyBase.addEventListener('touchmove', function(e) {
  e.preventDefault(); if (!joyActive) return; procJoy(e.touches[0])
}, { passive: false })

joyBase.addEventListener('touchend', function(e) {
  e.preventDefault(); joyActive = false; joyRect = null
  joyThumb.style.left = '50%'; joyThumb.style.top = '50%'
  myInput.mx = 0; myInput.my = 0
})

function procJoy(t) {
  if (!joyRect) return
  var dx = t.clientX - joyRect.cx, dy = t.clientY - joyRect.cy
  var dist = Math.sqrt(dx * dx + dy * dy)
  if (dist > joyRect.mr) { dx = dx / dist * joyRect.mr; dy = dy / dist * joyRect.mr }
  var jx = dx / joyRect.mr, jy = dy / joyRect.mr
  joyThumb.style.left = (jx * 50 + 50) + '%'
  joyThumb.style.top = (jy * 50 + 50) + '%'
  myInput.mx = jx; myInput.my = jy
}

// Buttons
var btnShoot = $('btnShoot'), shootLabel = $('shootLabel')

btnShoot.addEventListener('touchstart', function(e) {
  e.preventDefault()
  btnShoot.classList.add('active')
  shootLabel.textContent = '松手!'
  sendMsg({ type: 'input', data: { action: 'shoot_start' } })
})

btnShoot.addEventListener('touchend', function(e) {
  e.preventDefault()
  btnShoot.classList.remove('active')
  shootLabel.textContent = '投篮'
  sendMsg({ type: 'input', data: { action: 'shoot_release' } })
})

// PC mouse support
btnShoot.addEventListener('mousedown', function() {
  btnShoot.classList.add('active')
  shootLabel.textContent = '松手!'
  sendMsg({ type: 'input', data: { action: 'shoot_start' } })
})

btnShoot.addEventListener('mouseup', function() {
  btnShoot.classList.remove('active')
  shootLabel.textContent = '投篮'
  sendMsg({ type: 'input', data: { action: 'shoot_release' } })
})

function bindBtn(id, action) {
  var btn = $(id)
  btn.addEventListener('touchstart', function(e) {
    e.preventDefault(); btn.classList.add('active')
    sendMsg({ type: 'input', data: { action: action } })
    setTimeout(function() { btn.classList.remove('active') }, 400)
  })
  btn.addEventListener('mousedown', function() {
    btn.classList.add('active')
    sendMsg({ type: 'input', data: { action: action } })
    setTimeout(function() { btn.classList.remove('active') }, 400)
  })
}

bindBtn('btnDrive', 'drive')
bindBtn('btnSteal', 'steal')
bindBtn('btnBlock', 'block')
bindBtn('btnFoul', 'foul')

// ==================== Game Over ====================
function showGameOver(msg) {
  var ov = $('gameOverOverlay')
  var p1n = myPlayer ? myPlayer.name : '你'
  var p2n = oppPlayer ? (oppPlayer.player ? oppPlayer.player.name : oppPlayer.name) : '对手'
  var winnerName = msg.winner.name
  var isDraw = false

  ov.innerHTML = '<div class="ov-box"><h2>' + winnerName + ' 获胜！</h2>' +
    '<div class="ov-score">' + msg.score[0] + ' - ' + msg.score[1] + '</div>' +
    '<div class="ov-stat">' + (p1n) + ': ' + (msg.stats.p1 ? msg.stats.p1.pts : 0) + '分 ' + (msg.stats.p1 ? msg.stats.p1.reb || 0 : 0) + '板 ' + (msg.stats.p1 ? msg.stats.p1.blk : 0) + '帽 ' + (msg.stats.p1 ? msg.stats.p1.stl : 0) + '断</div>' +
    '<div class="ov-stat">' + (p2n) + ': ' + (msg.stats.p2 ? msg.stats.p2.pts : 0) + '分 ' + (msg.stats.p2 ? msg.stats.p2.reb || 0 : 0) + '板 ' + (msg.stats.p2 ? msg.stats.p2.blk : 0) + '帽 ' + (msg.stats.p2 ? msg.stats.p2.stl : 0) + '断</div>' +
    '<button class="ov-detail" onclick="requestRematch()">再来一局</button>' +
    '<button class="ov-again" onclick="goHome()">返回首页</button></div>'
  ov.classList.add('show')

  if (gameLoop) { clearInterval(gameLoop); gameLoop = null }
  gameStarted = false
}

function hideGameOver() {
  $('gameOverOverlay').classList.remove('show')
}

function requestRematch() {
  sendMsg({ type: 'rematch_request' })
  $('gameOverOverlay').classList.remove('show')
  if (gameLoop) { clearInterval(gameLoop); gameLoop = null }
  gameState = null; gameEvents = []
}

function showGameOverOverlay() {} // stub

function goHome() {
  if (gameLoop) { clearInterval(gameLoop); gameLoop = null }
  gameStarted = false; gameState = null; gameEvents = []
  $('gamePage').style.display = 'none'
  $('gameOverOverlay').classList.remove('show')
  $('countdownOverlay').classList.remove('show')
  $('lobby').style.display = 'flex'
  isQueuing = false
  sendMsg({ type: 'leave_queue' })
  myInput = { mx: 0, my: 0 }
  renderLobby()
}

// ==================== Init ====================
window.addEventListener('resize', function() {
  if ($('gamePage').style.display === 'flex') resizeCanvas()
})

// Auto-connect on page load
setTimeout(function() {
  if (!wsConnected) {
    // Auto-connect to same host (cloud deployment) or use URL param
    var params = new URLSearchParams(window.location.search)
    var autoHost = params.get('host') || params.get('server') || ''
    if (autoHost) {
      connectWS(autoHost)
    } else if (window.location.hostname !== 'localhost' && window.location.hostname !== '127.0.0.1') {
      connectWS(getAutoUrl())
    }
  }
}, 300)

renderLobby()
