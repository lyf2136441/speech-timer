<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover, maximum-scale=1.0">
<title>CBA篮球1v1</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
body{background:#0f0f1a;overflow:hidden;touch-action:manipulation;font-family:-apple-system,sans-serif;width:100vw;height:100vh;height:100dvh}
#app{width:100%;height:100%;position:relative}

/* 模式选择 */
#modePage{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5;gap:24px}
#modePage h1{font-size:32px;color:#ff8c00;letter-spacing:3px;font-weight:900;text-align:center}
#modePage .sub{font-size:13px;color:#888;text-align:center;margin-top:-12px}
.mode-btn{width:260px;height:80px;border-radius:20px;border:2px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:#fff;font-size:20px;font-weight:bold;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;transition:all .2s}
.mode-btn:active{transform:scale(.95)}
.mode-btn.single{border-color:rgba(255,140,0,.4);background:rgba(255,140,0,.1)}
.mode-btn.online{border-color:rgba(0,136,255,.4);background:rgba(0,136,255,.1)}
.mode-btn .ico{font-size:32px}
.mode-btn .desc{font-size:11px;opacity:.6}

/* 选人页 */
#selectPage{position:absolute;top:0;left:0;right:0;bottom:0;display:none;flex-direction:column;z-index:10;overflow-y:auto}
.s-header{text-align:center;padding:12px 0 6px;flex-shrink:0}
.s-header h2{font-size:20px;color:#ff8c00;letter-spacing:2px;font-weight:900}
.s-header p{font-size:11px;color:#888;margin-top:2px}
.mode-tag{display:inline-block;padding:2px 10px;border-radius:10px;font-size:10px;font-weight:bold;margin-left:4px}
.mode-tag.single{background:rgba(255,140,0,.3);color:#ff8c00}
.mode-tag.online{background:rgba(0,136,255,.3);color:#4af}
.conn-row{display:flex;align-items:center;justify-content:center;gap:6px;padding:4px 16px;flex-shrink:0}
.conn-row input{flex:1;max-width:180px;height:30px;background:#111;border:1px solid #333;border-radius:5px;color:#fff;padding:0 10px;font-size:12px}
.conn-row button{height:30px;padding:0 12px;border-radius:5px;border:none;font-size:11px;font-weight:bold;background:#ff8c00;color:#000}
.stag{font-size:9px;padding:2px 8px;border-radius:8px;font-weight:bold}
.stag.on{background:#0a3;color:#fff}.stag.off{background:#a30;color:#fff}
.versus{display:flex;align-items:flex-start;padding:0 4px;flex-shrink:0}
.pick{flex:1;background:#1a1a2e;border-radius:12px;overflow:hidden;min-height:130px}
.pick-head{padding:10px;text-align:center;color:#fff}
.pick-head .lbl{font-size:11px;opacity:.7}
.pick-head .nm{font-size:16px;font-weight:bold;margin:2px 0}
.pick-head .tm{font-size:10px;opacity:.6}
.pick-head .ph{font-size:14px;opacity:.3;font-weight:normal}
.attrs-box{padding:4px 8px}
.attr-row{display:flex;align-items:center;margin-bottom:3px}
.attr-row .an{width:26px;font-size:9px;color:#aaa;flex-shrink:0}
.attr-row .ab{flex:1;height:4px;background:#333;border-radius:2px;margin:0 3px;overflow:hidden}
.attr-row .ab div{height:100%;border-radius:2px}
.attr-row .av{width:20px;font-size:9px;color:#fff;text-align:right}
.vs-badge{display:flex;align-items:center;justify-content:center;width:36px;flex-shrink:0;padding-top:45px;font-size:20px;font-weight:bold;color:#ff4444}
.s-hint{text-align:center;padding:4px;font-size:12px;color:#ff8c00;flex-shrink:0}
.team-scroll{display:flex;overflow-x:auto;padding:4px 8px;gap:6px;flex-shrink:0;-webkit-overflow-scrolling:touch}
.team-scroll::-webkit-scrollbar{display:none}
.t-chip{border:2px solid #333;border-radius:14px;padding:5px 12px;font-size:11px;color:#aaa;white-space:nowrap;flex-shrink:0;cursor:pointer}
.t-chip.active{color:#fff;background:#2a2a4e}
#playerList{flex:1;overflow-y:auto;background:#1a1a2e;margin:0 4px;border-radius:10px;-webkit-overflow-scrolling:touch}
.p-card{display:flex;justify-content:space-between;align-items:center;padding:10px;border-bottom:1px solid rgba(255,255,255,.04);cursor:pointer}
.p-card.sel{background:rgba(255,140,0,.12)}
.p-card .cl{display:flex;align-items:center;gap:8px}
.p-card .num{font-size:15px;font-weight:bold;color:#ff8c00;width:36px}
.p-card .name{font-size:14px;color:#fff;width:80px}
.p-card .pos{font-size:10px;color:#888;background:#2a2a4e;padding:2px 7px;border-radius:5px}
.p-card .ms{display:flex;flex-wrap:wrap;gap:3px;font-size:8px;color:#999}
.p-card .ms span{background:#222;padding:1px 4px;border-radius:3px}
#startBtn{height:48px;background:#333;color:#888;border:none;border-radius:24px;font-size:17px;font-weight:bold;pointer-events:none;transition:all .3s;margin:8px 16px;flex-shrink:0;padding:0}
#startBtn.ready{background:linear-gradient(135deg,#ff8c00,#ff4444);color:#fff;pointer-events:auto;box-shadow:0 4px 20px rgba(255,68,68,.4)}
.back-row{text-align:center;padding:4px 16px 8px;flex-shrink:0}
.back-row button{background:none;border:1px solid #444;color:#888;padding:6px 20px;border-radius:14px;font-size:12px}

/* 排队 */
.q-overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.82);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:50}
.q-overlay.show{display:flex}
.q-icon{font-size:56px;animation:pulse 1s infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.q-text{font-size:18px;color:#ff8c00;margin-top:12px}
.q-sub{font-size:12px;color:#888;margin-top:2px}
.q-cancel{height:38px;padding:0 28px;border-radius:19px;border:none;background:#a30;color:#fff;font-size:13px;margin-top:16px}

/* 倒计时 */
#cdOverlay{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.75);display:none;align-items:center;justify-content:center;z-index:100;flex-direction:column}
#cdOverlay.show{display:flex}
.cd-num{font-size:80px;font-weight:bold;color:#ffd700}
.cd-opp{font-size:15px;color:#fff;margin-top:2px}

/* 游戏页 */
#gamePage{position:absolute;top:0;left:0;right:0;bottom:0;display:none;flex-direction:column;z-index:20}
#gameCanvas{flex:1;width:100%;display:block}
.ctrls{display:flex;justify-content:space-between;align-items:flex-end;padding:6px 10px 20px}
.joy-wrap{display:flex;flex-direction:column;align-items:center}
.joy-base{width:96px;height:96px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.2);border-radius:50%;position:relative}
.joy-thumb{width:42px;height:42px;background:rgba(255,140,0,.5);border-radius:50%;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.joy-label{font-size:9px;color:rgba(255,255,255,.4);margin-top:3px}
.btns{display:flex;flex-direction:column;gap:6px}
.btns-row{display:flex;gap:6px;justify-content:flex-end}
.btn{width:74px;height:64px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;border:2px solid rgba(255,255,255,.12);background:rgba(255,255,255,.08);color:rgba(255,255,255,.7);transition:all .08s}
.btn:active,.btn.active{background:rgba(255,140,0,.25);border-color:#ff8c00;transform:scale(.92)}
.btn.shoot{width:96px;height:74px;background:rgba(255,68,68,.18);border-color:rgba(255,68,68,.25)}
.btn.drive{background:rgba(0,136,255,.15);border-color:rgba(0,136,255,.2)}
.btn.steal{background:rgba(255,200,0,.12);border-color:rgba(255,200,0,.2)}
.btn.block{background:rgba(255,0,0,.12);border-color:rgba(255,0,0,.2)}
.btn.foul{background:rgba(255,68,0,.15);border-color:rgba(255,68,0,.3)}
.btn .ico{font-size:22px}
.btn .lbl{font-size:9px;margin-top:1px}

/* 叠加 */
.overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.75);display:none;align-items:center;justify-content:center;z-index:100}
.overlay.show{display:flex}
.ov-box{background:#1a1a2e;border-radius:20px;padding:32px 24px;text-align:center;width:300px;max-width:90vw}
.ov-box h2{font-size:21px;color:#ffd700}
.ov-box .ov-score{font-size:36px;font-weight:bold;color:#fff;margin:6px 0 12px}
.ov-box .ov-stat{font-size:11px;color:#aaa;margin:2px 0}
.ov-box button{width:100%;height:40px;border-radius:20px;border:none;font-size:14px;font-weight:bold;margin-top:7px;padding:0}
.ov-box .ov-rematch{background:linear-gradient(135deg,#ff8c00,#ff4444);color:#fff}
.ov-box .ov-home{background:rgba(255,255,255,.1);color:#ccc}
.ov-box .ov-detail{background:linear-gradient(135deg,#ff8c00,#ff4444);color:#fff}

/* 设置页 */
#settingsPage{position:absolute;top:0;left:0;right:0;bottom:0;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:15;gap:14px;padding:24px;overflow-y:auto}
#settingsPage h2{font-size:20px;color:#ff8c00}
.set-card{background:#1a1a2e;border-radius:16px;padding:18px;width:310px;max-width:90vw}
.set-card h3{font-size:13px;color:#888;margin-bottom:10px}
.set-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.set-opt{padding:8px 14px;border-radius:10px;border:2px solid #333;background:#111;color:#aaa;font-size:13px;cursor:pointer;text-align:center;flex:1;min-width:55px;transition:all .15s}
.set-opt.sel{border-color:#ff8c00;color:#ff8c00;background:#2a1a0e}
.set-label{font-size:11px;color:#666;margin-bottom:6px}
#settingsStart{width:310px;max-width:90vw;height:48px;border-radius:24px;border:none;font-size:17px;font-weight:bold;background:linear-gradient(135deg,#ff8c00,#ff4444);color:#fff;margin-top:4px;padding:0}
</style>
</head>
<body>
<div id="app">
  <div id="modePage"></div>
  <div id="selectPage"></div>
  <div id="settingsPage"></div>
  <div id="cdOverlay"><div class="cd-num" id="cdNum">3</div><div class="cd-opp" id="cdOpp"></div></div>
  <div id="gamePage">
    <canvas id="gameCanvas"></canvas>
    <div class="ctrls">
      <div class="joy-wrap">
        <div class="joy-base" id="joyBase"><div class="joy-thumb" id="joyThumb"></div></div>
        <div class="joy-label">移动</div>
      </div>
      <div class="btns">
        <div class="btns-row">
          <button class="btn shoot" id="btnShoot"><span class="ico">🏀</span><span class="lbl" id="shootLabel">投篮</span></button>
          <button class="btn drive" id="btnDrive"><span class="ico">💨</span><span class="lbl">突破</span></button>
        </div>
        <div class="btns-row">
          <button class="btn steal" id="btnSteal"><span class="ico">✋</span><span class="lbl">抢断</span></button>
          <button class="btn block" id="btnBlock"><span class="ico">🧱</span><span class="lbl">盖帽</span></button>
          <button class="btn foul" id="btnFoul"><span class="ico">⚠️</span><span class="lbl">犯规</span></button>
        </div>
      </div>
    </div>
    <div class="overlay" id="gameOverOverlay"></div>
  </div>
</div>

function startMode(mode){
  gameMode=mode;player1=null;player2=null;selectingFor=1;currentTeamId='liaoning';selectedPid='';
  isQueuing=false;gameState=null;wsConnected=false;
  modePage.style.display='none';selectPage.style.display='flex';gamePage.style.display='none';
  if(mode==='online'){setTimeout(function(){if(window.location.hostname!=='localhost'&&window.location.hostname!=='127.0.0.1')connectWS(getAutoUrl())},300)}
  renderSelect();
}

// ====== WebSocket ======
function getAutoUrl(){var p=window.location.protocol==='https:'?'wss:':'ws:';return p+'//'+window.location.host}
function connectWS(url){
  if(ws){try{ws.close()}catch(e){}}
  var u=url||getAutoUrl();if(u.indexOf('://')===-1)u='ws://'+u;
  ws=new WebSocket(u);
  ws.onopen=function(){wsConnected=true;if(gameMode==='online')renderSelect();};
  ws.onmessage=function(e){handleMsg(JSON.parse(e.data))};
  ws.onclose=function(){wsConnected=false;if(gameStarted)goHome();if(gameMode==='online')renderSelect();};
  ws.onerror=function(){wsConnected=false;if(gameMode==='online')renderSelect();};
}
function sendMsg(d){if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify(d))}
function handleMsg(msg){
  switch(msg.type){
    case 'connected':myId=msg.playerId;break;
    case 'queued':isQueuing=true;renderSelect();break;
    case 'matched':roomId=msg.roomId;mySide=msg.side;player2=msg.opponent.player||msg.opponent;cdOpp.textContent='VS '+player2.name;cdOverlay.classList.add('show');cdNum.textContent='3';break;
    case 'jump_countdown':cdNum.textContent=msg.count>0?msg.count:'GO!';break;
    case 'game_start':cdOverlay.classList.remove('show');startOnlineGame();break;
    case 'state_sync':gameState=msg.state;break;
    case 'score_update':if(gameState){gameState.sc=msg.score}break;
    case 'possession_change':if(gameState){gameState.po=msg.poss}break;
    case 'foul_called':if(gameState){gameState.ph='freethrow';gameState.fts=msg.shooter}break;
    case 'game_over':showOnlineGameOver(msg);break;
    case 'opponent_disconnected':alert('对手已断开！');goHome();break;
    case 'rematch_start':gameState=null;goOverlay.classList.remove('show');cdOverlay.classList.add('show');cdNum.textContent='3';break;
  }
}

function renderPlayerCard(p,label){
  if(!p)return '<div class="pick"><div class="pick-head"><span class="lbl">'+label+'</span><span class="nm ph">选择球员</span></div></div>';
  var h='<div class="pick"><div class="pick-head" style="background:'+p.teamColor+'"><span class="lbl">'+label+'</span><span class="nm">'+p.name+'</span><span class="tm">'+p.teamAbbr+' #'+p.num+'</span></div><div class="attrs-box">';
  ATTR_KEYS.forEach(function(k,i){var v=p[k];
    h+='<div class="attr-row"><span class="an">'+ATTR_NAMES[i]+'</span><div class="ab"><div style="width:'+v+'%;background:'+(v>70?'#0c6':v>40?'#fa0':'#f44')+'"></div></div><span class="av">'+v+'</span></div>';});
  return h+'</div></div>';
}

function renderSelect(){
  var modeLabel=gameMode==='single'?'<span class="mode-tag single">单机模式</span>':'<span class="mode-tag online">联机模式</span>';
  var h='<div class="s-header"><h2>选择球员 '+modeLabel+'</h2></div>';

  if(gameMode==='online'){
    var tag=wsConnected?'<span class="stag on">已连接</span>':'<span class="stag off">未连接</span>';
    h+='<div class="conn-row"><input id="serverInp" placeholder="服务器地址" value="'+getAutoUrl().replace('ws','http')+'"><button onclick="doConn()">连接</button>'+tag+'</div>';
  }

  h+='<div class="versus">';
  h+=renderPlayerCard(player1,'我方');
  h+='<div class="vs-badge">VS</div>';
  h+=renderPlayerCard(gameMode==='single'?player2:(isQueuing?player2:null),gameMode==='single'?'AI对手':'对手');
  h+='</div>';

  if(gameMode==='single'){
    h+='<div class="s-hint">'+((player1&&player2)?'已选好双方球员':'为 '+(selectingFor===1?'我方':'AI对手')+' 选择球员')+'</div>';
  }else{
    h+='<div class="s-hint">'+(isQueuing?'🔍 匹配中...':(player1?(wsConnected?'点下方按钮开始匹配':'请先连接服务器'):'选择你的球员'))+'</div>';

  // 动画效果 — 与原始一致
  if(s.blkA&&s.blkA>0){var bp=s.blkA/500;ctx.fillStyle='rgba(255,200,0,0.5)';ctx.beginPath();ctx.arc(_(p2.x),_(p2.y)-_(25)-bp*_(60),_(15)*(1-bp),0,Math.PI*2);ctx.fill()}
  if(s.stlA&&s.stlA>0){var sp=s.stlA/400;ctx.strokeStyle='rgba(255,255,0,0.6)';ctx.lineWidth=2;ctx.beginPath();ctx.arc(_(p2.x),_(p2.y),_(35)*(1+sp),0,Math.PI*2);ctx.stroke()}
  if(s.drvA&&s.drvA>0){ctx.strokeStyle='rgba(0,136,255,0.5)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(_(p1.x),_(p1.y));ctx.lineTo(_(p1.x),_(p1.y)-_(50));ctx.stroke()}

  // Ball — 与原始_drawBall一致
  var ba=s.ba||{x:375,y:340,ia:false,ps:true};
  if(!ba.ps||ba.ia||s.shotPath){
    var bx=_(ba.x),by=_(ba.y),br=_(10);
    ctx.fillStyle='#ff8c00';ctx.beginPath();ctx.arc(bx,by,br,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#cc6600';ctx.lineWidth=1.5;ctx.stroke();
    ctx.strokeStyle='#333';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(bx-br,by);ctx.lineTo(bx+br,by);ctx.stroke();
    ctx.beginPath();ctx.arc(bx,by,br*0.5,0,Math.PI*2);ctx.stroke();
  }
  // Shot path虚线
  if(s.shotPath){var sp2=s.shotPath;ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=1;ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(_(sp2.sx),_(sp2.sy));
    for(var i2=1;i2<=20;i2++){var t2=i2/20;ctx.lineTo(_(sp2.sx+(sp2.ex-sp2.sx)*t2),_(sp2.sy+(sp2.ey-sp2.sy)*t2-sp2.peakH*Math.sin(Math.PI*t2)))}ctx.stroke();ctx.setLineDash([])}

  // UI — 与原始_drawUI一致
  ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,w,_(44));
  var sc0=s.sc?s.sc[0]:0,sc1=s.sc?s.sc[1]:0;
  ctx.fillStyle='#1a6dd4';ctx.font='bold '+Math.floor(_(13))+'px sans-serif';ctx.textAlign='center';ctx.fillText(p1data?p1data.name:'P1',w*0.2,_(18));
  ctx.fillStyle='#fff';ctx.font='bold '+Math.floor(_(18))+'px sans-serif';ctx.fillText(sc0+' - '+sc1,w/2,_(18));
  ctx.fillStyle='#e03030';ctx.font='bold '+Math.floor(_(13))+'px sans-serif';ctx.fillText(p2data?p2data.name:'P2',w*0.8,_(18));
  var sc2=Math.max(0,Math.ceil(s.cl||24));
  ctx.fillStyle=sc2<=5?'#ff4444':'#fff';ctx.font='bold '+Math.floor(_(11))+'px sans-serif';ctx.fillText(sc2+'s',w-_(28),_(18));
  var phaseT=s.ph==='freethrow'?'罚球: '+(s.fts===0?(p1data?p1data.name:'P1'):(p2data?p2data.name:'P2'))+' ('+(s.ftm||0)+'/2)':s.ph==='jumpball'?'跳球中...':'球权: '+(s.po===0?(p1data?p1data.name:'P1'):(p2data?p2data.name:'P2'));
  ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font=Math.floor(_(10))+'px sans-serif';ctx.textAlign='center';ctx.fillText(phaseT,w/2,_(34));

  // 计时器
  if(s.gt!==undefined){var remMs=s.ot?s.ott:(s.gt||0);var remSec=Math.ceil(remMs/1000),mins=Math.floor(remSec/60),secs=remSec%60;var timeStr=mins+':'+(secs<10?'0':'')+secs;
    ctx.fillStyle=remMs<=30000?'#ff4444':remMs<=60000?'#ff0':'#fff';ctx.font='bold '+Math.floor(_(12))+'px sans-serif';ctx.textAlign='center';
    var tl=(s.ot?'⏱ OT ':'⏱ ')+timeStr;if(s.gtype==='target'&&s.tgt)tl+=' | 🎯'+s.tgt+'分';ctx.fillText(tl,w/2,_(58))}

  if(s.nct&&!s.ctd){ctx.fillStyle='#ff0';ctx.font='bold '+Math.floor(_(14))+'px sans-serif';ctx.textAlign='center';ctx.fillText('⚠ 需运球出三分线！',w/2,_(65))}

  // 投篮条
  if(s.sh){var bw=_(180),bh=_(10),bx2=w/2-bw/2,by2=h-_(90);ctx.fillStyle='#333';ctx.fillRect(bx2,by2,bw,bh);ctx.fillStyle='rgba(0,255,0,0.3)';ctx.fillRect(bx2+bw*0.45,by2,bw*0.1,bh);
    var p=s.sp||0,mc=p>=.45&&p<=.55?'#00ff00':p>=.35&&p<=.65?'#ffff00':'#ff0000';ctx.fillStyle=mc;ctx.fillRect(bx2,by2,bw*p,bh);
    ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.strokeRect(bx2,by2,bw,bh);ctx.fillStyle='#fff';ctx.font='bold '+Math.floor(_(11))+'px sans-serif';ctx.textAlign='center';
    ctx.fillText((s.ph==='freethrow'?'罚球':'投篮')+' 力度 '+Math.floor(p*100)+'%',w/2,by2-_(6))}

  // 得分动画
  if(s.san>0&&s.spt>0){var ao2=Math.min(1,s.san/800);var o2=(1500-(s.san>1500?1500:s.san))/1500*_(40);ctx.fillStyle='rgba(255,255,0,'+ao2+')';ctx.font='bold '+Math.floor(_(22))+'px sans-serif';ctx.textAlign='center';ctx.fillText('+'+s.spt,w/2,_(180)-o2)}

  // 消息
  if(s.ev&&s.ev.length>0){var am3=Math.min(1,(s.msgT||1500)/300);ctx.fillStyle='rgba(255,255,255,'+am3+')';ctx.font='bold '+Math.floor(_(16))+'px sans-serif';ctx.textAlign='center';ctx.fillText(s.ev[s.ev.length-1],w/2,h-_(160))}

  // 体力条
  var ey=_(48),eh=_(5),ew=_(70),eg=_(10);ctx.fillStyle='#333';ctx.fillRect(eg,ey,ew,eh);ctx.fillStyle='#0cf';ctx.fillRect(eg,ey,ew*((p1.e||100)/100),eh);ctx.fillStyle='#333';ctx.fillRect(w-eg-ew,ey,ew,eh);ctx.fillStyle='#0cf';ctx.fillRect(w-eg-ew,ey,ew*((p2.e||100)/100),eh);

  // 犯规冷却
  if(s.fcd&&s.fcd[mySideIdx]&&s.fcd[mySideIdx]>0){ctx.fillStyle='rgba(255,68,0,0.4)';ctx.font=Math.floor(_(10))+'px sans-serif';ctx.textAlign='center';ctx.fillText('犯规冷却'+(s.fcd[mySideIdx]/1000).toFixed(1)+'s',w-_(50),_(60))}

  // 游戏结束
  if(s.ph==='gameover'){ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,h/2-_(40),w,_(80));ctx.fillStyle='#ffd700';ctx.font='bold '+Math.floor(_(24))+'px sans-serif';ctx.textAlign='center';
    var wn2=s.winner===0?(p1data?p1data.name:'P1'):(p2data?p2data.name:'P2');ctx.fillText(wn2+' 获胜！',w/2,h/2+_(6))}
}

// ====== 单机模式游戏循环 ======
function startSingleGame(){
  if(!player1||!player2)return;
  selectPage.style.display='none';document.getElementById('settingsPage').style.display='none';gamePage.style.display='flex';
  goOverlay.classList.remove('show');cdOverlay.classList.remove('show');
  resizeCanvas();
  engine=new GameEngine(canvas.width,canvas.height,player1,player2,gameSettings);engine.bgImage=bgImage;gameEnded=false;lastTime=performance.now();
  if(gameLoop)clearInterval(gameLoop);
  gameLoop=setInterval(function(){
    var now=performance.now(),dt=now-lastTime;lastTime=now;
    engine.update(dt);engine.offInput.mx=myInput.mx;engine.offInput.my=myInput.my;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    engine.render(ctx);
    if(engine.gameOver&&!gameEnded){gameEnded=true;clearInterval(gameLoop);showSingleGameOver()}
  },16);
}

function showSingleGameOver(){
  var s=engine.stats,w=engine.winner,sc=engine.score;
  var h='<div class="ov-box"><h2>'+(w===0?player1.name:player2.name)+' 获胜！</h2><div class="ov-score">'+sc[0]+' - '+sc[1]+'</div>';
  h+='<div class="ov-stat">'+player1.name+': '+s.p1.pts+'分 '+(s.p1.reb||0)+'板 '+s.p1.blk+'帽 '+s.p1.stl+'断</div>';
  h+='<div class="ov-stat">'+player2.name+': '+s.p2.pts+'分 '+(s.p2.reb||0)+'板 '+s.p2.blk+'帽 '+s.p2.stl+'断</div>';
  h+='<button class="ov-rematch" onclick="startSingleGame()">再来一局</button><button class="ov-home" onclick="goHome()">返回首页</button></div>';
  goOverlay.innerHTML=h;goOverlay.classList.add('show');
}

// ====== 联机模式游戏循环 ======
function startOnlineGame(){
  selectPage.style.display='none';gamePage.style.display='flex';goOverlay.classList.remove('show');
  resizeCanvas();gameStarted=true;
  if(gameLoop)clearInterval(gameLoop);
  gameLoop=setInterval(function(){sendOnlineInput();renderOnlineGame()},33);
}

function sendOnlineInput(){
  if(!wsConnected||!gameState)return;
  sendMsg({type:'input',data:{action:'move',mx:myInput.mx,my:myInput.my}});
}

function renderOnlineGame(){
  if(!ctx||!canvas||!gameState)return;
  var p1d=mySide===0?player1:player2,p2d=mySide===1?player1:player2;
  renderSharedState(gameState,p1d,p2d,mySide);
}

function showOnlineGameOver(msg){
  if(gameLoop){clearInterval(gameLoop);gameLoop=null}gameStarted=false;
  var p1n=player1?player1.name:'我方',p2n=player2?(player2.name||'对手'):'对手';
  var h='<div class="ov-box"><h2>'+msg.winner.name+' 获胜！</h2><div class="ov-score">'+msg.score[0]+' - '+msg.score[1]+'</div>';
  h+='<div class="ov-stat">'+p1n+': '+(msg.stats.p1?msg.stats.p1.pts:0)+'分 '+(msg.stats.p1?msg.stats.p1.reb||0:0)+'板 '+(msg.stats.p1?msg.stats.p1.blk:0)+'帽 '+(msg.stats.p1?msg.stats.p1.stl:0)+'断</div>';
  h+='<div class="ov-stat">'+p2n+': '+(msg.stats.p2?msg.stats.p2.pts:0)+'分 '+(msg.stats.p2?msg.stats.p2.reb||0:0)+'板 '+(msg.stats.p2?msg.stats.p2.blk:0)+'帽 '+(msg.stats.p2?msg.stats.p2.stl:0)+'断</div>';
  h+='<button class="ov-rematch" onclick="rematchOnline()">再来一局</button><button class="ov-home" onclick="goHome()">返回首页</button></div>';
  goOverlay.innerHTML=h;goOverlay.classList.add('show');
}

function rematchOnline(){sendMsg({type:'rematch_request'});goOverlay.classList.remove('show');gameState=null}

// ====== 通用 ======
function resizeCanvas(){
  var r=gamePage.getBoundingClientRect();canvas.width=r.width;canvas.height=r.height-155;
  canvas.style.width=r.width+'px';canvas.style.height=(r.height-155)+'px';
}
function goHome(){
  if(gameLoop){clearInterval(gameLoop);gameLoop=null}gameStarted=false;gameState=null;engine=null;
  gamePage.style.display='none';goOverlay.classList.remove('show');cdOverlay.classList.remove('show');
  isQueuing=false;if(wsConnected)sendMsg({type:'leave_queue'});
  myInput={mx:0,my:0};startMode(gameMode);
}
window.addEventListener('resize',function(){if(gamePage.style.display==='flex')resizeCanvas()});

// ====== 触控 ======
function getJoyR(){var r=joyBase.getBoundingClientRect();joyRect={cx:r.left+r.width/2,cy:r.top+r.height/2,mr:r.width/2}}
joyBase.addEventListener('touchstart',function(e){e.preventDefault();joyActive=true;getJoyR();procJ(e.touches[0])},{passive:false});
joyBase.addEventListener('touchmove',function(e){e.preventDefault();if(!joyActive)return;procJ(e.touches[0])},{passive:false});
joyBase.addEventListener('touchend',function(e){e.preventDefault();joyActive=false;joyRect=null;joyThumb.style.left='50%';joyThumb.style.top='50%';myInput.mx=0;myInput.my=0});
function procJ(t){if(!joyRect)return;var dx=t.clientX-joyRect.cx,dy=t.clientY-joyRect.cy;var d=Math.sqrt(dx*dx+dy*dy);if(d>joyRect.mr){dx=dx/d*joyRect.mr;dy=dy/d*joyRect.mr}var jx=dx/joyRect.mr,jy=dy/joyRect.mr;joyThumb.style.left=(jx*50+50)+'%';joyThumb.style.top=(jy*50+50)+'%';myInput.mx=jx;myInput.my=jy}

btnShoot.addEventListener('touchstart',function(e){e.preventDefault();btnShoot.classList.add('active');shootLabel.textContent='松手!';
  if(gameMode==='single'&&engine)engine.startShoot();else if(gameMode==='online')sendMsg({type:'input',data:{action:'shoot_start'}})});
btnShoot.addEventListener('touchend',function(e){e.preventDefault();btnShoot.classList.remove('active');shootLabel.textContent='投篮';
  if(gameMode==='single'&&engine)engine.releaseShoot();else if(gameMode==='online')sendMsg({type:'input',data:{action:'shoot_release'}})});
btnShoot.addEventListener('mousedown',function(){btnShoot.classList.add('active');shootLabel.textContent='松手!';
  if(gameMode==='single'&&engine)engine.startShoot();else if(gameMode==='online')sendMsg({type:'input',data:{action:'shoot_start'}})});
btnShoot.addEventListener('mouseup',function(){btnShoot.classList.remove('active');shootLabel.textContent='投篮';
  if(gameMode==='single'&&engine)engine.releaseShoot();else if(gameMode==='online')sendMsg({type:'input',data:{action:'shoot_release'}})});

function bindBtn(id,act){
  var b=$(id);b.addEventListener('touchstart',function(e){e.preventDefault();b.classList.add('active');
    if(gameMode==='single'&&engine){if(act==='drive')engine.drive();else if(act==='steal')engine.steal();else if(act==='block')engine.block();else if(act==='foul')engine.foul()}
    else if(gameMode==='online')sendMsg({type:'input',data:{action:act}});
    setTimeout(function(){b.classList.remove('active')},400)});
  b.addEventListener('mousedown',function(){b.classList.add('active');
    if(gameMode==='single'&&engine){if(act==='drive')engine.drive();else if(act==='steal')engine.steal();else if(act==='block')engine.block();else if(act==='foul')engine.foul()}
    else if(gameMode==='online')sendMsg({type:'input',data:{action:act}});
    setTimeout(function(){b.classList.remove('active')},400)});
}
bindBtn('btnDrive','drive');bindBtn('btnSteal','steal');bindBtn('btnBlock','block');bindBtn('btnFoul','foul');

// ====== 启动 ======
showModePage();
</script>
