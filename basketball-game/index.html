<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>CBA篮球1v1</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
body{background:#0f0f1a;overflow:hidden;touch-action:manipulation;font-family:-apple-system,sans-serif;width:100vw;height:100vh;height:100dvh}
#app{width:100%;height:100%;position:relative}

/* === 模式选择 === */
#modePage{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5;gap:24px;background:#0f0f1a}
#modePage h1{font-size:32px;color:#ff8c00;letter-spacing:3px;font-weight:900;text-align:center}
#modePage .sub{font-size:13px;color:#888;text-align:center;margin-top:-12px}
.mode-btn{width:260px;height:80px;border-radius:20px;border:2px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:#fff;font-size:20px;font-weight:bold;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;transition:all .2s}
.mode-btn:active{transform:scale(.95)}
.mode-btn.single{border-color:rgba(255,140,0,.4);background:rgba(255,140,0,.1)}
.mode-btn.online{border-color:rgba(0,136,255,.4);background:rgba(0,136,255,.1)}
.mode-btn .ico{font-size:32px}
.mode-btn .desc{font-size:11px;opacity:.6}
/* 联机：连接栏 */
.conn-inline{display:flex;align-items:center;gap:6px;flex-shrink:0}
.conn-inline input{width:160px;height:30px;background:#111;border:1px solid #333;border-radius:5px;color:#fff;padding:0 8px;font-size:11px}
.conn-inline button{height:30px;padding:0 10px;border-radius:5px;border:none;font-size:11px;font-weight:bold;background:#ff8c00;color:#000}
.stag{font-size:9px;padding:2px 8px;border-radius:8px;font-weight:bold}
.stag.on{background:#0a3;color:#fff}.stag.off{background:#a30;color:#fff}
/* 排队 */
.q-badge{display:inline-block;padding:4px 12px;border-radius:12px;background:rgba(255,140,0,.2);color:#ff8c00;font-size:12px;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
/* 倒计时覆盖 */
#cdOverlay{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.75);display:none;align-items:center;justify-content:center;z-index:100;flex-direction:column}
#cdOverlay.show{display:flex}
.cd-num{font-size:80px;font-weight:bold;color:#ffd700}
.cd-opp{font-size:15px;color:#fff;margin-top:2px}
/* 选人页 */
#selectPage{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;z-index:10}
.s-header{text-align:center;padding:16px 0 8px;flex-shrink:0}
.s-header h1{font-size:24px;color:#ff8c00;letter-spacing:2px;font-weight:900}
.s-header p{font-size:12px;color:#888;margin-top:2px}
.versus{display:flex;align-items:flex-start;padding:0 4px;flex-shrink:0}
.pick{flex:1;background:#1a1a2e;border-radius:12px;overflow:hidden;min-height:140px}
.pick-head{padding:10px;text-align:center;color:#fff}
.pick-head .lbl{font-size:11px;opacity:.7}
.pick-head .nm{font-size:18px;font-weight:bold;margin:2px 0}
.pick-head .tm{font-size:11px;opacity:.6}
.pick-head .ph{font-size:14px;opacity:.3;font-weight:normal}
.attrs-box{padding:6px 10px}
.attr-row{display:flex;align-items:center;margin-bottom:4px}
.attr-row .an{width:30px;font-size:10px;color:#aaa;flex-shrink:0}
.attr-row .ab{flex:1;height:5px;background:#333;border-radius:3px;margin:0 4px;overflow:hidden}
.attr-row .ab div{height:100%;border-radius:3px}
.attr-row .av{width:22px;font-size:10px;color:#fff;text-align:right}
.vs-badge{display:flex;align-items:center;justify-content:center;width:40px;flex-shrink:0;padding-top:50px;font-size:22px;font-weight:bold;color:#ff4444}
.s-hint{text-align:center;padding:6px;font-size:13px;color:#ff8c00;flex-shrink:0}
.team-scroll{display:flex;overflow-x:auto;padding:6px 8px;gap:8px;flex-shrink:0;-webkit-overflow-scrolling:touch}
.team-scroll::-webkit-scrollbar{display:none}
.t-chip{border:2px solid #333;border-radius:16px;padding:6px 14px;font-size:12px;color:#aaa;white-space:nowrap;flex-shrink:0;cursor:pointer}
.t-chip.active{color:#fff;background:#2a2a4e}
#playerList{flex:1;overflow-y:auto;background:#1a1a2e;margin:0 4px;border-radius:10px;-webkit-overflow-scrolling:touch}
.p-card{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid rgba(255,255,255,.04);cursor:pointer}
.p-card.sel{background:rgba(255,140,0,.12)}
.p-card .cl{display:flex;align-items:center;gap:10px}
.p-card .num{font-size:16px;font-weight:bold;color:#ff8c00;width:40px}
.p-card .name{font-size:15px;color:#fff;width:90px}
.p-card .pos{font-size:11px;color:#888;background:#2a2a4e;padding:2px 8px;border-radius:6px}
.p-card .ms{display:flex;flex-wrap:wrap;gap:4px;font-size:9px;color:#999}
.p-card .ms span{background:#222;padding:1px 5px;border-radius:4px}
#startBtn{position:absolute;bottom:30px;left:24px;right:24px;height:50px;background:#333;color:#888;border:none;border-radius:25px;font-size:18px;font-weight:bold;pointer-events:none;transition:all .3s;z-index:20;padding:0}
#startBtn.ready{background:linear-gradient(135deg,#ff8c00,#ff4444);color:#fff;pointer-events:auto;box-shadow:0 4px 20px rgba(255,68,68,.4)}

/* 游戏页 */
#gamePage{position:absolute;top:0;left:0;right:0;bottom:0;display:none;flex-direction:column;z-index:20}
#gameCanvas{flex:1;width:100%;display:block}
.ctrls{display:flex;justify-content:space-between;align-items:flex-end;padding:8px 12px 24px}
.joy-wrap{display:flex;flex-direction:column;align-items:center}
.joy-base{width:100px;height:100px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.2);border-radius:50%;position:relative}
.joy-thumb{width:44px;height:44px;background:rgba(255,140,0,.5);border-radius:50%;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.joy-label{font-size:10px;color:rgba(255,255,255,.4);margin-top:4px}
.btns{display:flex;flex-direction:column;gap:8px}
.btns-row{display:flex;gap:8px;justify-content:flex-end}
.btn{width:80px;height:70px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;border:2px solid rgba(255,255,255,.12);background:rgba(255,255,255,.08);color:rgba(255,255,255,.7);transition:all .08s}
.btn:active,.btn.active{background:rgba(255,140,0,.25);border-color:#ff8c00;transform:scale(.92)}
.btn.shoot{width:100px;height:80px;background:rgba(255,68,68,.18);border-color:rgba(255,68,68,.25)}
.btn.drive{background:rgba(0,136,255,.15);border-color:rgba(0,136,255,.2)}
.btn.steal{background:rgba(255,200,0,.12);border-color:rgba(255,200,0,.2)}
.btn.block{background:rgba(255,0,0,.12);border-color:rgba(255,0,0,.2)}
.btn.foul{background:rgba(255,68,0,.15);border-color:rgba(255,68,0,.3)}
.btn .ico{font-size:24px}
.btn .lbl{font-size:10px;margin-top:2px}
.overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:100}
.overlay.show{display:flex}
.ov-box{background:#1a1a2e;border-radius:20px;padding:36px 32px;text-align:center;width:300px}
.ov-box h2{font-size:24px;color:#ffd700}
.ov-box .ov-score{font-size:42px;font-weight:bold;color:#fff;margin:8px 0 16px}
.ov-box .ov-stat{font-size:13px;color:#aaa;margin:4px 0}
.ov-box button{width:100%;height:44px;border-radius:22px;border:none;font-size:16px;font-weight:bold;margin-top:10px;padding:0}
.ov-box .ov-detail{background:linear-gradient(135deg,#ff8c00,#ff4444);color:#fff}
.ov-box .ov-again{background:rgba(255,255,255,.1);color:#ccc}

/* 结果页 */
#resultPage{position:absolute;top:0;left:0;right:0;bottom:0;display:none;flex-direction:column;overflow-y:auto;z-index:30;background:#0f0f1a;padding:24px 16px 120px;-webkit-overflow-scrolling:touch}
#resultPage.show{display:flex}
.r-head{text-align:center;margin-bottom:20px}
.r-head .trophy{font-size:50px}
.r-head h2{font-size:22px;color:#ffd700;margin:4px 0}
.r-head .r-score{font-size:48px;font-weight:bold;color:#fff}
.r-compare{display:flex;gap:10px}
.r-player{flex:1;background:#1a1a2e;border-radius:14px;padding:16px;text-align:center;opacity:.7}
.r-player.w{opacity:1}
.r-player .rn{font-size:18px;font-weight:bold;color:#fff}
.r-player .rt{font-size:12px;color:#888}
.r-stats{display:flex;flex-wrap:wrap;margin-top:12px}
.r-stats .rs{width:50%;padding:8px 0}
.rs .rsv{font-size:24px;font-weight:bold;color:#ff8c00}
.rs .rsl{font-size:10px;color:#888}
.attr-section{background:#1a1a2e;border-radius:14px;padding:20px;margin-top:16px}
.attr-section h3{font-size:14px;color:#fff;text-align:center;margin-bottom:12px}
.ac-row{margin-bottom:10px}
.ac-labels{display:flex;justify-content:space-between;font-size:10px;color:#888;margin-bottom:2px}
.ac-bars{display:flex;align-items:center;gap:6px}
.ac-bar{height:8px;flex:1}
.ac-bar.l{border-radius:4px 0 0 4px}
.ac-bar.r{border-radius:0 4px 4px 0}
.ac-mid{font-size:10px;color:#666;white-space:nowrap;width:50px;text-align:center}
.r-btns{position:fixed;bottom:24px;left:16px;right:16px;display:flex;gap:12px}
.r-btns button{flex:1;height:48px;border-radius:24px;border:none;font-size:16px;font-weight:bold;padding:0}
.r-btns .r-rematch{flex:2;background:linear-gradient(135deg,#ff8c00,#ff4444);color:#fff}
.r-btns .r-home{background:rgba(255,255,255,.1);color:#ccc}
</style>
</head>
<body>
<div id="app">
  <div id="modePage"></div>
  <div id="cdOverlay"><div class="cd-num" id="cdNum">3</div><div class="cd-opp" id="cdOpp"></div></div>
  <!-- 选人页 -->
  <div id="selectPage"></div>
  <!-- 游戏页 -->
  <div id="gamePage">
    <canvas id="gameCanvas"></canvas>
    <div class="ctrls">
      <div class="joy-wrap">
        <div class="joy-base" id="joyBase"><div class="joy-thumb" id="joyThumb"></div></div>
        <div class="joy-label">移动</div>
      </div>
      <div class="btns">
        <div class="btns-row">
          <button class="btn shoot" id="btnShoot"><span class="ico">🏀</span><span class="lbl" id="shootLabel">投篮</span></button>
          <button class="btn drive" id="btnDrive"><span class="ico">💨</span><span class="lbl">突破</span></button>
        </div>
        <div class="btns-row">
          <button class="btn steal" id="btnSteal"><span class="ico">✋</span><span class="lbl">抢断</span></button>
          <button class="btn block" id="btnBlock"><span class="ico">🧱</span><span class="lbl">盖帽</span></button>
          <button class="btn foul" id="btnFoul"><span class="ico">⚠️</span><span class="lbl">犯规</span></button>
        </div>
      </div>
    </div>
    <div class="overlay" id="gameOverOverlay"></div>
  </div>
  <!-- 结果页 -->
  <div id="resultPage"></div>
</div>

<script>
// ==================== 模式选择 + 联机 ====================
var GAME_MODE=''; // 'single' | 'online'
var ws=null,wsConnected=false,mySide=-1,roomId='',gameState=null,isQueuing=false,oppData=null,onlineStarted=false;
function showModePage(){
  var sp=$('selectPage'),gp=$('gamePage'),mp=$('modePage');
  sp.style.display='none';gp.style.display='none';mp.style.display='flex';
  $('gameOverOverlay').classList.remove('show');$('cdOverlay').classList.remove('show');
  mp.innerHTML='<h1>🏀 CBA篮球1v1</h1><div class="sub">选择游戏模式</div>'+
    '<div class="mode-btn single" onclick="startMode(\'single\')"><span class="ico">🤖</span>单机模式<span class="desc">与AI对战</span></div>'+
    '<div class="mode-btn online" onclick="startMode(\'online\')"><span class="ico">🌐</span>联机模式<span class="desc">真人实时对战</span></div>';
}
function startMode(mode){
  GAME_MODE=mode;$('modePage').style.display='none';$('selectPage').style.display='flex';
  player1=null;player2=null;selectingFor=1;currentTeamId='liaoning';selectedPid='';
  isQueuing=false;gameState=null;onlineStarted=false;
  if(mode==='online'){setTimeout(function(){if(window.location.hostname!=='localhost'&&window.location.hostname!=='127.0.0.1')connectWS(getAutoUrl())},300)}
  renderSelectPage();
}
function getAutoUrl(){var p=window.location.protocol==='https:'?'wss:':'ws:';return p+'//'+window.location.host}
function connectWS(url){
  if(ws){try{ws.close()}catch(e){}}
  var u=url||getAutoUrl();if(u.indexOf('://')===-1)u='ws://'+u;ws=new WebSocket(u);
  ws.onopen=function(){wsConnected=true;renderSelectPage();};
  ws.onmessage=function(e){handleMsg(JSON.parse(e.data))};
  ws.onclose=function(){wsConnected=false;if(onlineStarted)goHome();renderSelectPage();};
  ws.onerror=function(){wsConnected=false;renderSelectPage();};
}
function sendMsg(d){if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify(d))}
function handleMsg(msg){
  switch(msg.type){
    case'connected':break;case'queued':isQueuing=true;renderSelectPage();break;
    case'matched':roomId=msg.roomId;mySide=msg.side;oppData=msg.opponent.player||msg.opponent;
      player2={name:oppData.name,teamColor:oppData.teamColor||'#e03030',num:oppData.num,teamAbbr:oppData.teamAbbr};$('cdOpp').textContent='VS '+player2.name;$('cdOverlay').classList.add('show');$('cdNum').textContent='3';break;
    case'jump_countdown':$('cdNum').textContent=msg.count>0?msg.count:'GO!';break;
    case'game_start':$('cdOverlay').classList.remove('show');startOnlineGame();break;
    case'state_sync':gameState=msg.state;break;
    case'score_update':if(gameState){gameState.sc=msg.score}break;
    case'possession_change':if(gameState){gameState.po=msg.poss}break;
    case'foul_called':if(gameState){gameState.ph='freethrow';gameState.fts=msg.shooter}break;
    case'game_over':showOnlineGameOver(msg);break;
    case'opponent_disconnected':alert('对手已断开！');goHome();break;
    case'rematch_start':gameState=null;$('gameOverOverlay').classList.remove('show');$('cdOverlay').classList.add('show');$('cdNum').textContent='3';break;
  }
}
function doConn(){var addr=$('srvInp').value.trim();if(!addr)return;if(addr.indexOf('://')>0)addr=addr.split('://')[1];if(!addr.includes(':'))addr+=':3456';connectWS(addr)}
// 在线游戏循环
function startOnlineGame(){
  onlineStarted=true;$('selectPage').style.display='none';$('gamePage').style.display='flex';
  resizeCanvas();
  if(gameLoop)clearInterval(gameLoop);
  gameLoop=setInterval(function(){sendOnlineInput();renderOnlineGame();},33);
}
function sendOnlineInput(){if(!wsConnected||!gameState)return;sendMsg({type:'input',data:{action:'move',mx:engine?engine.offInput.mx:0,my:engine?engine.offInput.my:0}})}
function renderOnlineGame(){
  if(!ctx||!canvas||!gameState)return;
  var w=canvas.width,h=canvas.height;
  ctx.clearRect(0,0,w,h);
  var s=gameState;
  // 用临时engine渲染: 把server state注入engine
  if(!engine)engine=new GameEngine(w,h);
  engine.w=w;engine.h=h;engine.scale=Math.min(w/750,h/500);
  engine.score=s.sc||[0,0];engine.poss=s.po!==undefined?s.po:0;
  engine.phase=s.ph||'playing';engine.shotClockTimer=(24-(s.cl||24))*1000;
  engine.p1=player1;engine.p2=player2||oppData||{name:'对手',teamColor:'#e03030',num:0};
  engine.offEnergy=s.p1?+s.p1.e||100:100;engine.defEnergy=s.p2?+s.p2.e||100:100;
  engine.shooting=s.sh||false;engine.shotPower=s.sp||0;
  engine.shotReleased=false;engine.ballInAir=s.ba?+s.ba.ia||false:false;
  engine.ball={x:engine._s(s.ba?+s.ba.x||375:375),y:engine._s(s.ba?+s.ba.y||340:340),r:engine._s(10),has:s.ba?+s.ba.ps!==false:true};
  engine.off={x:engine._s(s.p1?+s.p1.x||375:375),y:engine._s(s.p1?+s.p1.y||380:380),r:engine._s(25)};
  engine.def={x:engine._s(s.p2?+s.p2.x||375:375),y:engine._s(s.p2?+s.p2.y||120:120),r:engine._s(25)};
  engine.needClearThree=s.nct||false;engine.clearThreeDone=s.ctd||false;
  engine.blockAnim=0;engine.stealAnim=0;engine.driveAnim=0;engine.scoredAnim=s.san||0;
  engine.foulCooldown=s.fcd?+s.fcd[mySide]||0:0;
  engine.foulCooldown=s.fcd?(s.fcd[mySide]||0):0;
  engine.msgTimer=s.ev&&s.ev.length>0?1500:0;engine.msg=s.ev&&s.ev.length>0?s.ev[s.ev.length-1]:'';
  engine.shotResult=s.spt>0?{made:true,pts:s.spt}:null;
  engine.ftShooter=s.fts!==undefined?s.fts:0;engine.ftMade=s.ftm||0;engine.ftCount=s.ftc||0;
  engine.winner=s.winner!==undefined?s.winner:-1;engine.gameOver=s.ph==='gameover';
  engine.phase=s.ph||'playing';
  engine._drawCourt(ctx);engine._drawPlayers(ctx);engine._drawBall(ctx);engine._drawUI(ctx);
}
function showOnlineGameOver(msg){
  if(gameLoop){clearInterval(gameLoop);gameLoop=null}onlineStarted=false;
  var ov=$('gameOverOverlay');
  var p1n=player1?player1.name:'我方',p2n=player2?(player2.name||'对手'):'对手';
  ov.innerHTML='<div class="ov-box"><h2>'+msg.winner.name+' 获胜！</h2><div class="ov-score">'+msg.score[0]+' - '+msg.score[1]+'</div>'+
    '<div class="ov-stat">'+p1n+': '+(msg.stats.p1?msg.stats.p1.pts:0)+'分 '+(msg.stats.p1?msg.stats.p1.reb||0:0)+'板</div>'+
    '<div class="ov-stat">'+p2n+': '+(msg.stats.p2?msg.stats.p2.pts:0)+'分 '+(msg.stats.p2?msg.stats.p2.reb||0:0)+'板</div>'+
    '<button class="ov-detail" onclick="rematchOnline()">再来一局</button><button class="ov-again" onclick="goHome()">返回首页</button></div>';
  ov.classList.add('show');
}
function rematchOnline(){sendMsg({type:'rematch_request'});$('gameOverOverlay').classList.remove('show');gameState=null}
// 重写goHome
var _origGoHome=goHome;
goHome=function(){
  if(gameLoop){clearInterval(gameLoop);gameLoop=null}onlineStarted=false;gameState=null;engine=null;
  isQueuing=false;if(wsConnected)sendMsg({type:'leave_queue'});
  player1=null;player2=null;selectingFor=1;currentTeamId='liaoning';selectedPid='';
  $('gamePage').style.display='none';$('gameOverOverlay').classList.remove('show');
  $('cdOverlay').classList.remove('show');$('resultPage').style.display='none';
  showModePage();
};
// 重写restartGame
restartGame=function(){
  if(GAME_MODE==='online'){$('gameOverOverlay').classList.remove('show');startOnlineGame();return;}
  $('gameOverOverlay').classList.remove('show');
  if(gameLoop)clearInterval(gameLoop);
  engine=new GameEngine(canvas.width,canvas.height);engine.bgImage=bgImage;
  engine.setPlayers(player1,player2);gameEnded=false;lastTime=performance.now();
  gameLoop=setInterval(function(){var now=performance.now(),dt=now-lastTime;lastTime=now;engine.update(dt);ctx.clearRect(0,0,canvas.width,canvas.height);engine.render(ctx);if(engine.gameOver&&!gameEnded){gameEnded=true;clearInterval(gameLoop);var wn=engine.winner===0?player1.name:player2.name;var ov2=$('gameOverOverlay');ov2.innerHTML='<div class="ov-box"><h2>'+wn+' 获胜！</h2><div class="ov-score">'+engine.score[0]+' - '+engine.score[1]+'</div><div class="ov-stat">'+player1.name+': '+engine.stats.p1.pts+'分 '+engine.stats.p1.blk+'帽 '+engine.stats.p1.stl+'断</div><div class="ov-stat">'+player2.name+': '+engine.stats.p2.pts+'分 '+engine.stats.p2.blk+'帽 '+engine.stats.p2.stl+'断</div><button class="ov-detail" onclick="showResult()">查看详情</button><button class="ov-again" onclick="restartGame()">再来一局</button></div>';ov2.classList.add('show')}},16);
};
// 重写btnSteal/btnBlock/btnFoul以支持联机
var _origBtnsInit=false;
function initOnlineBtns(){
  if(_origBtnsInit)return;_origBtnsInit=true;
  var btns={btnDrive:'drive',btnSteal:'steal',btnBlock:'block'};
  Object.keys(btns).forEach(function(id){var b=$(id);var act=btns[id];
    b.addEventListener('touchstart',function(e){e.preventDefault();b.classList.add('active');if(GAME_MODE==='online'){sendMsg({type:'input',data:{action:act}})};if(GAME_MODE==='single'&&engine){if(act==='drive')engine.drive();else if(act==='steal')engine.steal();else if(act==='block')engine.block()};setTimeout(function(){b.classList.remove('active')},400)});

function getAllPlayers(){
  const a=[];
  CBA_TEAMS.forEach(t=>t.players.forEach(p=>a.push({...p,teamId:t.id,teamName:t.name,teamAbbr:t.abbr,teamColor:t.color})));

function getPlayersByTeam(id){
  const t=CBA_TEAMS.find(t=>t.id===id);
  return t?t.players.map(p=>({...p,teamId:t.id,teamName:t.name,teamAbbr:t.abbr,teamColor:t.color})):[];
}

// ==================== 音效系统 ====================
var SFX={ctx:null,init:function(){if(!this.ctx)this.ctx=new(window.AudioContext||window.webkitAudioContext)()},
  play:function(freq,dur,type,vol,slide){
    if(!this.ctx)this.init();if(this.ctx.state==='suspended')this.ctx.resume();
    var o=this.ctx.createOscillator(),g=this.ctx.createGain();
    o.type=type||'square';o.frequency.setValueAtTime(freq,this.ctx.currentTime);
    if(slide)o.frequency.linearRampToValueAtTime(freq*slide,this.ctx.currentTime+dur);
    g.gain.setValueAtTime(vol||0.08,this.ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,this.ctx.currentTime+dur);
    o.connect(g);g.connect(this.ctx.destination);o.start();o.stop(this.ctx.currentTime+dur);
  },
  bounce:function(){this.play(120,0.08,'square',0.05,0.5);setTimeout(function(){SFX.play(80,0.06,'square',0.03,0.5)},40)},
  swish:function(){this.play(800,0.1,'sine',0.06,1.5);setTimeout(function(){SFX.play(600,0.08,'sine',0.04,1.3)},60)},
  buzzer:function(){this.play(200,0.4,'sawtooth',0.1,0.6)},
  whistle:function(){this.play(880,0.15,'square',0.07,1.2);setTimeout(function(){SFX.play(660,0.12,'square',0.05,1.1)},80)},
  score:function(){this.play(523,0.08,'square',0.06,1.3);setTimeout(function(){SFX.play(659,0.08,'square',0.05,1.3)},80);setTimeout(function(){SFX.play(784,0.12,'square',0.07,1.0)},160)},
  block:function(){this.play(60,0.2,'triangle',0.12,0.4)}
};

// ==================== 游戏引擎 ====================
class GameEngine {
  constructor(w,h){
    this.w=w;this.h=h;
    this.scale=Math.min(w/750,h/500);
    this.bgImage=null;
    this.poss=0;this.score=[0,0];this.gameOver=false;this.winner=-1;
    this.stats={p1:{pts:0,blk:0,stl:0,reb:0},p2:{pts:0,blk:0,stl:0,reb:0}};
    this.shooting=false;this.shotPower=0;this.shotReleased=false;
    this.ballInAir=false;this.offInput={mx:0,my:0};this.defInput={mx:0,my:0};
    this.blockAnim=0;this.stealAnim=0;this.driveAnim=0;this.scoredAnim=0;
    this.msg='';this.msgTimer=0;this.shotResult=null;
    this.offEnergy=100;this.defEnergy=100;
    this.shotClockTimer=0;this._powAnim=0;
    // 新状态
    this.phase='jumpball'; // jumpball | playing | freethrow | gameover
    this.jumpCountdown=3;this.jumpCDTimer=0;this.jumpBallTossed=false;
    this.jumpBallVx=0;this.jumpBallVy=0;
    this.needClearThree=false;this.clearThreeDone=false;
    this.ftCount=0;this.ftMade=0;this.ftShooter=0;
    this._shotPath=null;this._shotProgress=0;this._shotSpeed=0;
    this.foulCooldown=0;
    this._init();
  }
  _s(v){return v*this.scale}
  _init(){
    const cx=this._s(375),cy=this._s(250);
    this.ball={x:cx,y:cy,vx:0,vy:0,r:this._s(10),has:false,trail:[]};
    // 平滑移动：速度惯性
    this.offVel={vx:0,vy:0};this.defVel={vx:0,vy:0};
    this.scoreFlash=0;this.rimShake=0;
    this._resetJumpBall();
  }
  _resetJumpBall(){
    const cx=this._s(375),cy=this._s(250);
    this.off={x:cx-this._s(40),y:cy,r:this._s(25),mx:0,my:0};
    this.def={x:cx+this._s(40),y:cy,r:this._s(25),mx:0,my:0};
    this.ball.x=cx;this.ball.y=cy;this.ball.vx=0;this.ball.vy=0;this.ball.has=false;
    this.ballInAir=false;this.jumpCountdown=3;this.jumpCDTimer=0;this.jumpBallTossed=false;
    this.shooting=false;this.shotPower=0;this.shotReleased=false;this.shotResult=null;
    this.needClearThree=false;this.clearThreeDone=false;
    this.phase='jumpball';
  }
  _resetAfterScore(){
    // 进球后：新进攻方从三分线外开始
    const cx=this._s(375),r=this._s(25);
    const outY=this._s(370);
    this.off.x=cx;this.off.y=outY;
    this.def.x=cx;this.def.y=this._s(120);
    this.ball.x=cx;this.ball.y=outY-r-this._s(5);
    this.ball.vx=0;this.ball.vy=0;this.ball.has=true;this.ballInAir=false;
    this.shooting=false;this.shotPower=0;this.shotReleased=false;this.shotResult=null;
    this._shotPath=null;this._shotProgress=0;
    this.needClearThree=false;this.clearThreeDone=false;
    this.shotClockTimer=0;
    this.stealAnim=0;this.blockAnim=0;this.driveAnim=0;
    this.offEnergy=Math.min(100,this.offEnergy+30);
    this.defEnergy=Math.min(100,this.defEnergy+30);
  }
  _resetFreeThrow(){
    const cx=this._s(375),ftY=this._s(250),r=this._s(25);
    const shooterIdx=this.ftShooter;
    if(shooterIdx===0){
      this.off.x=cx;this.off.y=ftY;
      this.def.x=cx;this.def.y=this._s(100);
    } else {
      this.def.x=cx;this.def.y=ftY;
      this.off.x=cx;this.off.y=this._s(100);
    }
    this.ball.x=cx;this.ball.y=ftY-r-this._s(5);
    this.ball.vx=0;this.ball.vy=0;this.ball.has=true;this.ballInAir=false;
    this.shooting=false;this.shotPower=0;this.shotReleased=false;this.shotResult=null;
    this._shotPath=null;this._shotProgress=0;
  }
  _reset(){
    const cx=this._s(375),r=this._s(25);
    this.off.x=cx;this.off.y=this._s(370);
    this.def.x=cx;this.def.y=this._s(120);
    this.ball.x=cx;this.ball.y=this._s(370)-r-this._s(5);
    this.ball.vx=0;this.ball.vy=0;this.ball.has=true;this.ballInAir=false;
    this.shooting=false;this.shotPower=0;this.shotReleased=false;this.shotResult=null;
    this._shotPath=null;this._shotProgress=0;
    this.needClearThree=false;this.clearThreeDone=false;
    this.shotClockTimer=0;
  }
  setPlayers(p1,p2){
    this.p1=p1;this.p2=p2;this._apply();
  }
  _apply(){
    if(!this.p1||!this.p2)return;
    const o=this.poss===0?this.p1:this.p2;
    const d=this.poss===0?this.p2:this.p1;
    this._oSpeed=2.5*(0.6+o.speed/99*0.8);
    this._dSpeed=2.5*(0.6+d.speed/99*0.7);
    this._oDrib=o.dribbling;this._oShoot=o.shooting;
    this._dDef=d.defense;this._dJump=d.jumping;
  }
  getOffPlayer(){return this.poss===0?this.p1:this.p2}
  getDefPlayer(){return this.poss===0?this.p2:this.p1}

  update(dt){
    if(this.phase==='gameover')return;
    dt=Math.min(dt,33);
    if(this.msgTimer>0)this.msgTimer-=dt;
    if(this.blockAnim>0)this.blockAnim-=dt;
    if(this.stealAnim>0)this.stealAnim-=dt;
    if(this.driveAnim>0)this.driveAnim-=dt;
    if(this.scoredAnim>0)this.scoredAnim-=dt;
    if(this.foulCooldown>0)this.foulCooldown-=dt;
    if(this.phase==='jumpball'){this._updateJumpBall(dt);return;}
    if(this.phase==='freethrow'){this._updateFreeThrow(dt);return;}
    this.offEnergy=Math.min(100,this.offEnergy+dt*0.008);
    this.defEnergy=Math.min(100,this.defEnergy+dt*0.008);
    this.shotClockTimer+=dt;
    if(this.shotClockTimer>=24000)this._changePoss('进攻超时！');
    if(this._shotPath){this._updateShotPath(dt);return;}
    this._physics(dt);
    this._move(dt);
    this._shootUpdate();
    this._collide();
    this._checkThreeClear();
    this._checkWin();
  }

  // === 跳球阶段 ===
  _updateJumpBall(dt){
    if(this.jumpCountdown>0){
      this.jumpCDTimer+=dt;
      if(this.jumpCDTimer>=700){this.jumpCountdown--;this.jumpCDTimer=0;
        if(this.jumpCountdown===0){this.jumpBallTossed=true;this.ballInAir=true;
          this.ball.vx=(Math.random()-0.5)*1.5;this.ball.vy=-6-this.shotPower;
          this._msg('跳球！');}}
      return;
    }
    this._moveJumpBall(dt);
    this._physicsJumpBall(dt);
    this._shootUpdate();
    // 检测谁碰到球
    if(this.ballInAir){
      const odx=this.off.x-this.ball.x,ody=this.off.y-this.ball.y;
      const ddx=this.def.x-this.ball.x,ddy=this.def.y-this.ball.y;
      const od=Math.sqrt(odx*odx+ody*ody),dd=Math.sqrt(ddx*ddx+ddy*ddy);
      const catchR=this._s(35);
      if(od<catchR){this.ballInAir=false;this.ball.has=true;this.poss=0;this._apply();this.phase='playing';this.shotClockTimer=0;this.needClearThree=false;this._msg('跳球成功！球权P1');}
      else if(dd<catchR){this.ballInAir=false;this.ball.has=true;this.poss=1;this._apply();this.phase='playing';this.shotClockTimer=0;this.needClearThree=false;this._msg('跳球成功！球权P2');}
    }
  }
  _moveJumpBall(dt){
    const mxW=this.w-this.off.r,mnX=this.off.r,mxH=this.h-this.off.r,mnY=this._s(40)+this.off.r;
    let os=this._oSpeed||3;
    let omx=this.offInput.mx,omy=this.offInput.my;
    if(omx!==0||omy!==0){const m=Math.sqrt(omx*omx+omy*omy);this.off.x+=omx/m*os*(dt/16);this.off.y+=omy/m*os*(dt/16)}
    // 防守方AI也移动去抢球
    const tox=this.ball.x-this.def.x,toy=this.ball.y-this.def.y,tod=Math.sqrt(tox*tox+toy*toy);
    if(tod>0){this.def.x+=tox/tod*this._dSpeed*(dt/16);this.def.y+=toy/tod*this._dSpeed*(dt/16)}
    this.off.x=Math.max(mnX,Math.min(mxW,this.off.x));
    this.off.y=Math.max(mnY,Math.min(mxH,this.off.y));
    this.def.x=Math.max(mnX,Math.min(mxW,this.def.x));
    this.def.y=Math.max(mnY,Math.min(mxH,this.def.y));
  }
  _physicsJumpBall(dt){
    if(!this.ballInAir)return;
    this.ball.vy+=0.3*(dt/16);
    this.ball.x+=this.ball.vx*(dt/16);
    this.ball.y+=this.ball.vy*(dt/16);
    if(this.ball.y>this.h-this._s(10)){this.ball.y=this.h-this._s(10)-this.ball.r;this.ball.vy=-Math.abs(this.ball.vy)*0.5;this.ball.vx*=0.7;
      if(Math.abs(this.ball.vy)<1){this.ballInAir=false;this.ball.has=true;
        const dtoO=Math.abs(this.off.x-this.ball.x),dtoD=Math.abs(this.def.x-this.ball.x);
        this.poss=dtoO<dtoD?0:1;this._apply();this.phase='playing';this.shotClockTimer=0;this.needClearThree=false;}
    }
  }

  // === 罚球阶段 ===
  _updateFreeThrow(dt){}
  _doFreeThrow(){
    const t=this._timing();
    let mp=t.basePct+10;
    mp+=this._oShoot/99*15;
    mp=Math.max(10,Math.min(98,mp));
    const made=Math.random()*100<mp;
    this.ball.has=false;
    const rx=this._s(375),ry=this._s(60);
    const sx=this.ball.x,sy=this.ball.y;
    const dx=rx-sx,dy=ry-sy,dist=Math.sqrt(dx*dx+dy*dy);
    if(made){
      const peakH=dist*0.5;
      this._shotPath={sx,sy,ex:rx,ey:ry,peakH,made:true};
    } else {
      const mx=(Math.random()-0.5)*this._s(35),my=(Math.random()-0.5)*this._s(20);
      this._shotPath={sx,sy,ex:rx+mx,ey:ry+my,peakH:dist*0.4,made:false};
    }
    this._shotProgress=0;this._shotSpeed=1/(dist/(7+this.shotPower*12));
    this.shotResult={made,pts:1,timing:t.label};
  }

  // === 抛物线投篮路径 ===
  _updateShotPath(dt){
    this._shotProgress+=this._shotSpeed*(dt/16);
    const t=Math.min(1,this._shotProgress);
    const {sx,sy,ex,ey,peakH}=this._shotPath;
    const x=sx+(ex-sx)*t;
    const y=sy+(ey-sy)*t-peakH*Math.sin(Math.PI*t);
    this.ball.x=x;this.ball.y=y;
    if(t>=1){
      this._shotPath=null;this._shotProgress=0;
      if(this.shotResult&&this.shotResult.made){
        this._onScore();
      } else {
        this._onMiss();
      }
    }
  }

  _physics(dt){
    if(!this.ballInAir){
      if(this.ball.has){this.ball.x=this.off.x;this.ball.y=this.off.y-this.off.r-this.ball.r}
      return;
    }
    this.ball.vy+=0.4*(dt/16);
    this.ball.x+=this.ball.vx*(dt/16);
    this.ball.y+=this.ball.vy*(dt/16);
    const rx=this._s(375),ry=this._s(60),rr=this._s(12);
    const dx=this.ball.x-rx,dy=this.ball.y-ry,dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<rr+this.ball.r&&this.ballInAir){
      const nx=dx/dist,ny=dy/dist,dot=this.ball.vx*nx+this.ball.vy*ny;
      this.ball.vx-=1.6*dot*nx;this.ball.vy-=1.6*dot*ny;
      this.ball.vx*=0.5;this.ball.vy*=0.5;
      this.ball.x+=nx*(rr+this.ball.r-dist+1);
      this.ball.y+=ny*(rr+this.ball.r-dist+1);
    }
    if(this.ball.y<this._s(48)&&this.ball.vy<0&&Math.abs(this.ball.x-rx)<this._s(80)){
      this.ball.y=this._s(48)+this.ball.r;this.ball.vy=Math.abs(this.ball.vy)*0.6;this.ball.vx*=0.7;
    }
    if(this.ball.y>this.h+50||Math.abs(this.ball.x)>this.w+50||this.ball.y<-200){
      this._changePoss('球出界！');
    }
    if(this.ball.y>this.h-this._s(10)&&this.ball.vy>0){
      this.ball.y=this.h-this._s(10)-this.ball.r;
      this.ball.vy=-Math.abs(this.ball.vy)*0.55;this.ball.vx*=0.7;
      if(Math.abs(this.ball.vy)<1){
        this.ballInAir=false;this.ball.has=true;
        this.shotResult=null;
        // 篮板球——检查球权是否转换
        const dtoO=Math.abs(this.off.x-this.ball.x)+(this.off.y-this.ball.y);
        const dtoD=Math.abs(this.def.x-this.ball.x)+(this.def.y-this.ball.y);
        const rebounder=dtoO<dtoD?this.poss:(this.poss===0?1:0);
        if(rebounder!==this.poss){
          this.poss=rebounder;this._apply();
          this.needClearThree=true;this.clearThreeDone=false;
          this.shotClockTimer=0;
          this.stats[this.poss===0?'p1':'p2'].reb++;
          this._msg('篮板球！球权转换！需出三分线');
        } else {
          this.stats[this.poss===0?'p1':'p2'].reb++;
          this.shotClockTimer=Math.max(0,this.shotClockTimer-7000);
          this._msg('进攻篮板！');
        }
      }
    }
  }

  _move(dt){
    var mxW=this.w-this.off.r,mnX=this.off.r,mxH=this.h-this.off.r,mnY=this._s(40)+this.off.r;
    var os=this._oSpeed,accel=0.15,friction=0.85;if(this.driveAnim>0){os=5;accel=0.3}
    var omx=this.offInput.mx,omy=this.offInput.my;if(this.driveAnim>0)omy=-1;
    // 平滑加速度
    var tx=omx*os,ty=omy*os;
    this.offVel.vx+=(tx-this.offVel.vx)*accel*(dt/16);
    this.offVel.vy+=(ty-this.offVel.vy)*accel*(dt/16);
    if(Math.abs(omx)<0.1&&Math.abs(omy)<0.1){this.offVel.vx*=friction;this.offVel.vy*=friction}
    this.off.x+=this.offVel.vx*(dt/16);this.off.y+=this.offVel.vy*(dt/16);
    // 防守AI(同样平滑)
    var tox=this.off.x-this.def.x,toy=this.off.y-this.def.y,tod=Math.sqrt(tox*tox+toy*toy),id=this._s(40);
    var tdx=0,tdy=0;
    if(tod>0&&tod>id+5){tdx+=(tox/tod)*0.8;tdy+=(toy/tod)*0.8}else if(tod<id-5&&tod>0){tdx-=(tox/tod)*0.3;tdy-=(toy/tod)*0.3}
    this.defVel.vx+=(tdx*this._dSpeed-this.defVel.vx)*0.12*(dt/16);
    this.defVel.vy+=(tdy*this._dSpeed-this.defVel.vy)*0.12*(dt/16);
    if(Math.abs(tdx)<0.1&&Math.abs(tdy)<0.1){this.defVel.vx*=0.9;this.defVel.vy*=0.9}
    this.def.x+=this.defVel.vx*(dt/16);this.def.y+=this.defVel.vy*(dt/16);
    this.off.x=Math.max(mnX,Math.min(mxW,this.off.x));this.off.y=Math.max(mnY,Math.min(mxH,this.off.y));
    this.def.x=Math.max(mnX,Math.min(mxW,this.def.x));this.def.y=Math.max(mnY,Math.min(mxH,this.def.y));
  }

  _shootUpdate(){
    if(!this.shooting||this.shotReleased)return;
    this._powAnim+=0.025;
    this.shotPower=Math.abs(Math.sin(this._powAnim));
  }

  _checkThreeClear(){
    if(!this.needClearThree||this.clearThreeDone)return;
    const rx=this._s(375),ry=this._s(60),tr=this._s(280);
    const dx=this.off.x-rx,dy=this.off.y-ry;
    if(Math.sqrt(dx*dx+dy*dy)>tr){
      this.clearThreeDone=true;this.needClearThree=false;
      this._msg('已出三分线！可以进攻');
    }
  }

  _collide(){
    if(this.stealAnim>0&&this.ball.has&&!this.shooting){
      const dx=this.def.x-this.off.x,dy=this.def.y-this.off.y;
      if(Math.sqrt(dx*dx+dy*dy)<this._s(35)){
        const c=0.25+this._dDef/99*0.35-this._oDrib/99*0.25;
        if(Math.random()<c){this._changePoss('抢断成功！');this.stats[this.poss===0?'p2':'p1'].stl++;this._msg('抢断！')}
        else this._msg('抢断失败');
        this.stealAnim=0;
      }
    }
  }

  _checkWin(){
    if(this.phase==='gameover')return;
    const d=Math.abs(this.score[0]-this.score[1]);
    if(this.score[0]>=11&&d>=2){this.phase='gameover';this.gameOver=true;this.winner=0}
    else if(this.score[1]>=11&&d>=2){this.phase='gameover';this.gameOver=true;this.winner=1}
  }

  startShoot(){
    if(this.phase==='freethrow'){
      if(this.shooting||this.shotReleased)return;
      this.shooting=true;this.shotPower=0;this.shotReleased=false;this._powAnim=0;return;
    }
    if(!this.ball.has||this.shooting||this.ballInAir||this.driveAnim>0)return;
    if(this.needClearThree){this._msg('需先出三分线！');return;}
    if(this.phase!=='playing')return;
    this.shooting=true;this.shotPower=0;this.shotReleased=false;this._powAnim=0;
  }
  releaseShoot(){
    if(!this.shooting||this.shotReleased)return;
    this.shotReleased=true;this.shooting=false;
    if(this.phase==='freethrow'){this._doFreeThrow();return;}
    this._doShot();
  }
  _doShot(){
    const t=this._timing();const dd=this._defDist();const ce=this._contest(dd);
    let mp=t.basePct;mp+=this._oShoot/99*20;mp-=ce;mp=Math.max(5,Math.min(98,mp));
    const is3=this.off.y>this._s(350);const pts=is3?3:2;
    const made=Math.random()*100<mp;
    this.ball.has=false;
    const rx=this._s(375),ry=this._s(60);
    const sx=this.ball.x,sy=this.ball.y;
    const dx=rx-sx,dy=ry-sy,dist=Math.sqrt(dx*dx+dy*dy);
    if(made){
      const peakH=dist*0.48;
      this._shotPath={sx,sy,ex:rx,ey:ry,peakH,made:true};
    } else {
      const mx=(Math.random()-0.5)*this._s(50),my=(Math.random()-0.5)*this._s(35);
      this._shotPath={sx,sy,ex:rx+mx,ey:ry+my,peakH:dist*(0.3+Math.random()*0.25),made:false};
    }
    this._shotProgress=0;this._shotSpeed=1/(dist/(7+this.shotPower*12));
    this.shotResult={made,pts,timing:t.label};
    this.ballInAir=true;
  }
  _timing(){
    const p=this.shotPower;
    if(p>=.45&&p<=.55)return{label:'完美',basePct:95};
    if(p>=.35&&p<=.65)return{label:'不错',basePct:70};
    if(p>=.2&&p<=.8)return{label:'一般',basePct:40};
    return{label:'太差',basePct:15};
  }
  _defDist(){const dx=this.def.x-this.off.x,dy=this.def.y-this.off.y;return Math.sqrt(dx*dx+dy*dy)}
  _contest(d){if(d>this._s(50))return 0;const f=1-d/this._s(50);return f*30+this._dDef/99*10}

  _onScore(){
    this.ballInAir=false;this.ball.has=false;
    this.ball.x=this._s(375);this.ball.y=this._s(100);
    this.ball.vx=0;this.ball.vy=0;this._shotPath=null;this._shotProgress=0;
    SFX.swish();setTimeout(function(){SFX.score()},120);
    this.rimShake=250;this.scoreFlash=350;
    if(this.shotResult&&this.shotResult.made){
      if(this.phase==='freethrow'){
        this.score[this.poss]+=1;
        this.stats[this.poss===0?'p1':'p2'].pts+=1;
        this.ftMade++;this.scoredAnim=1200;
        this._msg(`${this.shotResult.timing}！罚球+1 (${this.ftMade}/2)`);
        setTimeout(()=>{
          if(this.ftMade>=2||this.ftCount<=1){
            this.phase='playing';this._changePoss('罚球结束');
          } else {
            this.ftCount--;this._resetFreeThrow();
          }
        },1200);
      } else {
        this.score[this.poss]+=this.shotResult.pts;
        this.stats[this.poss===0?'p1':'p2'].pts+=this.shotResult.pts;
        this.scoredAnim=1500;this._msg(`${this.shotResult.timing}！+${this.shotResult.pts}分`);
        setTimeout(()=>{
          this.poss=this.poss===0?1:0;this._apply();
          this._resetAfterScore();
          this.phase='playing';
        },1500);
      }
    }
    this.shotResult=null;
  }
  _onMiss(){
    this.ballInAir=true;
    this.ball.vx=(Math.random()-0.5)*3;
    this.ball.vy=2+Math.random()*2;
    this.shotResult=null;
    if(this.phase==='freethrow'){
      this.ftCount--;
      if(this.ftCount<=0){
        setTimeout(()=>{this.phase='playing';this._changePoss('罚球结束');},1000);
      } else {
        setTimeout(()=>this._resetFreeThrow(),800);
      }
    }
  }
  _changePoss(reason){
    if(this.scoredAnim>0)return;if(reason)this._msg(reason);
    setTimeout(()=>{
      this.poss=this.poss===0?1:0;this._apply();this._reset();
      this.shotClockTimer=0;this.shotResult=null;this.ballInAir=false;
      this._shotPath=null;this._shotProgress=0;
      this.stealAnim=0;this.blockAnim=0;this.driveAnim=0;
      this.needClearThree=false;this.clearThreeDone=false;
      this.offEnergy=Math.min(100,this.offEnergy+30);
      this.defEnergy=Math.min(100,this.defEnergy+30);
      this.phase='playing';
    },1200);
  }
  _msg(t){this.msg=t;this.msgTimer=1500}

  steal(){
    if(this.phase!=='playing'||!this.ball.has||this.shooting||this.stealAnim>0||this.defEnergy<20){if(this.defEnergy<20)this._msg('体力不足');return}
    this.stealAnim=400;this.defEnergy-=20;
    const dx=this.def.x-this.off.x,dy=this.def.y-this.off.y,dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<this._s(52)){
      const c=(dist<this._s(35)?0.3:0.12)+this._dDef/99*0.35-this._oDrib/99*0.3;
      if(Math.random()<c){this._changePoss('抢断成功！');this.stats[this.poss===0?'p2':'p1'].stl++;this._msg('抢断成功！');return}
    }
    this._msg('抢断失败');
  }
  block(){
    if(this.phase!=='playing')return;
    if(!this._shotPath||this.blockAnim>0||this.defEnergy<25){if(this.defEnergy<25)this._msg('体力不足');else if(!this._shotPath)this._msg('等待投篮');return}
    this.blockAnim=500;this.defEnergy-=25;
    const bx=this.ball.x,by=this.ball.y;
    const dx=this.def.x-bx,dy=this.def.y-by,dist=Math.sqrt(dx*dx+dy*dy);
    if(dist<this._s(60)){
      const c=0.15+this._dDef/99*0.25+this._dJump/99*0.2;
      if(Math.random()<c){
        this._shotPath=null;this._shotProgress=0;this.shotResult=null;
        this.ballInAir=true;this.ball.has=false;
        this.ball.vy=Math.abs(this.ball.vy||3)*1.5;this.ball.vx=(Math.random()-.5)*8;
        this._msg('盖帽！');
        this.stats[this.poss===0?'p2':'p1'].blk++;
        setTimeout(()=>{if(this.ballInAir)this._changePoss('盖帽！')},2000);return;
      }
    }
    this._msg('盖帽失败');
  }
  drive(){
    if(this.phase!=='playing'||!this.ball.has||this.shooting||this.driveAnim>0||this.offEnergy<30){if(this.offEnergy<30)this._msg('体力不足');return}
    if(this.needClearThree){this._msg('需先出三分线！');return;}
    this.driveAnim=600;this.offEnergy-=30;this._msg('突破！');
    const d=this._defDist();
    if(d<this._s(25)){
      const c=0.35+this.p1.speed/99*0.35-this._dDef/99*0.25;
      if(Math.random()>c){this._msg('突破被阻！');this.driveAnim=200;setTimeout(()=>this._changePoss('进攻犯规！'),300)}
    }
  }
  foul(){
    if(this.phase!=='playing'||this.foulCooldown>0||!this.ball.has||this.defEnergy<15){if(this.defEnergy<15)this._msg('体力不足');else if(this.foulCooldown>0)this._msg('冷却中');return}
    this.foulCooldown=5000;this.defEnergy-=15;SFX.whistle();
    this.ftShooter=this.poss;this.ftCount=2;this.ftMade=0;
    this.phase='freethrow';
    this._msg('犯规！对方罚球2次');
    this._resetFreeThrow();
  }

  // === 渲染 ===
  render(ctx){
    const w=this.w,h=this.h;
    if(this.bgImage){
      ctx.drawImage(this.bgImage,0,0,w,h);
      ctx.fillStyle='rgba(0,0,0,0.30)';ctx.fillRect(0,0,w,h);
    }
    this._drawCourt(ctx);
    this._drawPlayers(ctx);
    this._drawBall(ctx);
    this._drawUI(ctx);
  }
  _drawCourt(ctx){
    var s=this.scale,cx=this._s(375);
    // 木地板
    var grad=ctx.createLinearGradient(0,0,0,this.h);
    grad.addColorStop(0,'#d4a056');grad.addColorStop(0.5,'#c8924a');grad.addColorStop(1,'#b8803a');
    ctx.fillStyle=grad;ctx.fillRect(0,0,this.w,this.h);
    // 木纹
    ctx.strokeStyle='rgba(0,0,0,0.08)';ctx.lineWidth=1;
    for(var y=0;y<this.h;y+=this._s(20)){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(this.w,y);ctx.stroke()}
    // 篮板
    var rx=cx,ry=this._s(60);
    // 得分震动效果
    if(this.rimShake>0){this.rimShake-=16;var sx=(Math.random()-0.5)*this._s(3)*Math.min(1,this.rimShake/150);var sy2=(Math.random()-0.5)*this._s(3)*Math.min(1,this.rimShake/150);rx+=sx;ry+=sy2}
    ctx.fillStyle='#ddd';ctx.fillRect(rx-this._s(50),ry-this._s(20),this._s(100),this._s(8));
    // 篮筐
    ctx.strokeStyle='#ff4444';ctx.lineWidth=3;
    ctx.beginPath();ctx.arc(rx,ry,this._s(12),0,Math.PI*2);ctx.stroke();
    // 网
    ctx.strokeStyle='rgba(255,255,255,0.2)';ctx.lineWidth=0.5;
    for(let i=0;i<4;i++){ctx.beginPath();ctx.moveTo(rx+Math.cos(-1.9+i*0.25)*this._s(10),ry+Math.sin(-1.9+i*0.25)*this._s(10));ctx.lineTo(rx,ry+this._s(30));ctx.stroke()}
    // 三分线
    const tr=this._s(280);
    ctx.strokeStyle='#fff';ctx.lineWidth=2;
    ctx.beginPath();ctx.arc(rx,ry,tr,Math.PI*0.5,Math.PI*1.5);ctx.stroke();
    // 禁区
    const pw=this._s(160),ph=this._s(200);
    if(this.bgImage){
      ctx.fillStyle='rgba(184,122,58,0.5)';ctx.fillRect(rx-pw/2,ry,pw,ph);
    } else {
      ctx.fillStyle='#b87a3a';ctx.fillRect(rx-pw/2,ry,pw,ph);
    }
    ctx.strokeStyle='#fff';ctx.strokeRect(rx-pw/2,ry,pw,ph);
    // 罚球线
    ctx.strokeStyle='#fff';ctx.lineWidth=2;
    ctx.beginPath();ctx.moveTo(rx-pw/2,ry+ph);ctx.lineTo(rx+pw/2,ry+ph);ctx.stroke();
    // 中圈
    ctx.beginPath();ctx.arc(cx,this.h-this._s(30),this._s(60),0,Math.PI);ctx.stroke();
  }
  _drawPlayers(ctx){
    const o=this.getOffPlayer(),d=this.getDefPlayer();
    if(this.phase==='freethrow'){
      const shooter=this.ftShooter===0?o:d;
      if(this.ftShooter===0){
        this._drawP(ctx,this.off,o,'#1a6dd4','罚');
        this._drawP(ctx,this.def,d,'#e03030','');
      } else {
        this._drawP(ctx,this.def,d,'#e03030','罚');
        this._drawP(ctx,this.off,o,'#1a6dd4','');
      }
    } else {
      this._drawP(ctx,this.def,d,'#e03030','守');
      this._drawP(ctx,this.off,o,'#1a6dd4','攻');
    }
    if(this.blockAnim>0){
      const p=this.blockAnim/500;
      ctx.fillStyle='rgba(255,200,0,0.5)';ctx.beginPath();
      ctx.arc(this.def.x,this.def.y-this.def.r-p*this._s(60),this._s(15)*(1-p),0,Math.PI*2);ctx.fill();
    }
    if(this.stealAnim>0){
      const p=this.stealAnim/400;
      ctx.strokeStyle='rgba(255,255,0,0.6)';ctx.lineWidth=2;ctx.beginPath();
      ctx.arc(this.def.x,this.def.y,this._s(35)*(1+p),0,Math.PI*2);ctx.stroke();
    }
    if(this.driveAnim>0){
      ctx.strokeStyle='rgba(0,136,255,0.5)';ctx.lineWidth=3;
      ctx.beginPath();ctx.moveTo(this.off.x,this.off.y);ctx.lineTo(this.off.x,this.off.y-this._s(50));ctx.stroke();
    }
  }
  _drawP(ctx,p,data,color,label){
    if(!data)return;
    const x=p.x,y=p.y,r=p.r;
    ctx.fillStyle='rgba(0,0,0,0.3)';ctx.beginPath();ctx.ellipse(x,y+r*0.9,r*0.8,r*0.2,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle='#fff';ctx.font=`bold ${Math.floor(r*0.8)}px sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(data.num||'?',x,y);
    ctx.font=`${Math.floor(r*0.45)}px sans-serif`;ctx.fillText(data.name,x,y-r-this._s(8));
    if(label){
      ctx.fillStyle=label==='攻'?'#ff0':label==='罚'?'#0f0':'#f88';
      ctx.font=`bold ${Math.floor(r*0.45)}px sans-serif`;
      ctx.fillText(label,x,y+r+this._s(10));
    }
  }
  _drawBall(ctx){
    if(!this.ball.has||this.ballInAir||this._shotPath){
      const bx=this.ball.x,by=this.ball.y,br=this.ball.r;
      ctx.fillStyle='#ff8c00';ctx.beginPath();ctx.arc(bx,by,br,0,Math.PI*2);ctx.fill();
      ctx.strokeStyle='#cc6600';ctx.lineWidth=1.5;ctx.stroke();
      ctx.strokeStyle='#333';ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(bx-br,by);ctx.lineTo(bx+br,by);ctx.stroke();
      ctx.beginPath();ctx.arc(bx,by,br*0.5,0,Math.PI*2);ctx.stroke();
    }
    // 投篮轨迹线
    if(this._shotPath){
      const {sx,sy,ex,ey,peakH}=this._shotPath;
      ctx.strokeStyle='rgba(255,255,255,0.3)';ctx.lineWidth=1;ctx.setLineDash([4,4]);
      ctx.beginPath();ctx.moveTo(sx,sy);
      for(let i=1;i<=20;i++){const t=i/20;ctx.lineTo(sx+(ex-sx)*t,sy+(ey-sy)*t-peakH*Math.sin(Math.PI*t))}
      ctx.stroke();ctx.setLineDash([]);
    }
  }
  _drawUI(ctx){
    var w=this.w,h=this.h;
    // 得分闪光
    if(this.scoreFlash>0){this.scoreFlash-=16;ctx.fillStyle='rgba(255,255,255,'+(Math.min(1,this.scoreFlash/300)*0.12)+')';ctx.fillRect(0,0,w,h)}
    // 顶栏
    ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,w,this._s(44));
    var p1=this.p1,p2=this.p2;
    ctx.fillStyle='#1a6dd4';ctx.font=`bold ${Math.floor(this._s(13))}px sans-serif`;ctx.textAlign='center';
    ctx.fillText(p1?p1.name:'P1',w*0.2,this._s(18));
    ctx.fillStyle='#fff';ctx.font=`bold ${Math.floor(this._s(18))}px sans-serif`;
    ctx.fillText(`${this.score[0]} - ${this.score[1]}`,w/2,this._s(18));
    ctx.fillStyle='#e03030';ctx.font=`bold ${Math.floor(this._s(13))}px sans-serif`;
    ctx.fillText(p2?p2.name:'P2',w*0.8,this._s(18));
    const sc=Math.max(0,Math.ceil(24-this.shotClockTimer/1000));
    ctx.fillStyle=sc<=5?'#ff4444':'#fff';ctx.font=`bold ${Math.floor(this._s(11))}px sans-serif`;
    ctx.fillText(`${sc}s`,w-this._s(28),this._s(18));
    ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font=`${Math.floor(this._s(10))}px sans-serif`;
    const possText=this.phase==='freethrow'?`罚球: ${this.ftShooter===0?(p1?p1.name:'P1'):(p2?p2.name:'P2')} (${this.ftMade}/2)`:(`球权: ${this.poss===0?(p1?p1.name:'P1'):(p2?p2.name:'P2')}`);
    ctx.fillText(possText,w/2,this._s(34));
    // 跳球倒计时
    if(this.phase==='jumpball'&&this.jumpCountdown>0){
      ctx.fillStyle='rgba(0,0,0,0.5)';ctx.fillRect(0,0,w,h);
      ctx.fillStyle='#ffd700';ctx.font=`bold ${Math.floor(this._s(72))}px sans-serif`;ctx.textAlign='center';
      ctx.fillText(this.jumpCountdown,w/2,h/2+this._s(18));
      ctx.fillStyle='#fff';ctx.font=`bold ${Math.floor(this._s(16))}px sans-serif`;
      ctx.fillText('跳球！移动摇杆争夺球权',w/2,h/2+this._s(50));
    }
    // 三分线提示
    if(this.needClearThree&&!this.clearThreeDone&&this.phase==='playing'){
      ctx.fillStyle='#ff0';ctx.font=`bold ${Math.floor(this._s(14))}px sans-serif`;ctx.textAlign='center';
      ctx.fillText('⚠ 需运球出三分线！',w/2,this._s(65));
    }
    // 投篮条
    if(this.shooting){
      const bw=this._s(180),bh=this._s(10),bx=w/2-bw/2,by=h-this._s(90);
      ctx.fillStyle='#333';ctx.fillRect(bx,by,bw,bh);
      ctx.fillStyle='rgba(0,255,0,0.3)';ctx.fillRect(bx+bw*0.45,by,bw*0.1,bh);
      let mc='#ff0000';const p=this.shotPower;
      if(p>=.45&&p<=.55)mc='#00ff00';else if(p>=.35&&p<=.65)mc='#ffff00';
      ctx.fillStyle=mc;ctx.fillRect(bx,by,bw*p,bh);
      ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.strokeRect(bx,by,bw,bh);
      ctx.fillStyle='#fff';ctx.font=`bold ${Math.floor(this._s(11))}px sans-serif`;ctx.textAlign='center';
      ctx.fillText((this.phase==='freethrow'?'罚球':'投篮')+` 力度 ${Math.floor(p*100)}%`,w/2,by-this._s(6));
    }
    // 得分
    if(this.scoredAnim>0&&this.shotResult){
      const a=Math.min(1,this.scoredAnim/800);const o=(1500-this.scoredAnim)/1500*this._s(40);
      ctx.fillStyle=`rgba(255,255,0,${a})`;ctx.font=`bold ${Math.floor(this._s(22))}px sans-serif`;ctx.textAlign='center';
      ctx.fillText(this.shotResult.made?`+${this.shotResult.pts}`:'打铁',w/2,this._s(180)-o);
    }
    // 消息
    if(this.msgTimer>0){
      const a=Math.min(1,this.msgTimer/300);
      ctx.fillStyle=`rgba(255,255,255,${a})`;ctx.font=`bold ${Math.floor(this._s(16))}px sans-serif`;ctx.textAlign='center';
      ctx.fillText(this.msg,w/2,h-this._s(160));
    }
    // 体力
    const ey=this._s(48),eh=this._s(5),ew=this._s(70),eg=this._s(10);
    ctx.fillStyle='#333';ctx.fillRect(eg,ey,ew,eh);
    ctx.fillStyle='#0cf';ctx.fillRect(eg,ey,ew*(this.offEnergy/100),eh);
    ctx.fillStyle='#333';ctx.fillRect(w-eg-ew,ey,ew,eh);
    ctx.fillStyle='#0cf';ctx.fillRect(w-eg-ew,ey,ew*(this.defEnergy/100),eh);
    // 犯规冷却指示
    if(this.foulCooldown>0){
      ctx.fillStyle='rgba(255,68,0,0.4)';ctx.font=`${Math.floor(this._s(10))}px sans-serif`;ctx.textAlign='center';
      ctx.fillText(`犯规冷却${(this.foulCooldown/1000).toFixed(1)}s`,w-this._s(50),this._s(60));
    }
    // 游戏结束
    if(this.phase==='gameover'){
      ctx.fillStyle='rgba(0,0,0,0.7)';ctx.fillRect(0,h/2-this._s(40),w,this._s(80));
      ctx.fillStyle='#ffd700';ctx.font=`bold ${Math.floor(this._s(24))}px sans-serif`;ctx.textAlign='center';
      const wn=this.winner===0?(p1?p1.name:'P1'):(p2?p2.name:'P2');
      ctx.fillText(`${wn} 获胜！`,w/2,h/2+this._s(6));
    }
  }
}

// ==================== 应用控制 ====================
const $=id=>document.getElementById(id);
const selectPage=$('selectPage'),gamePage=$('gamePage'),resultPage=$('resultPage');
const canvas=$('gameCanvas'),ctx=canvas.getContext('2d');

let player1=null,player2=null,selectingFor=1,currentTeamId='liaoning',selectedPid='';
let engine=null,gameLoop=null,lastTime=0,gameEnded=false,bgImage=null;

// 加载背景图片
(function(){
  var img=new Image();
  img.onload=function(){bgImage=img;};
  img.src='images/guoailun.jpg';
})();

// === 初始化选人页 ===
function renderSelectPage(){
  const teams=CBA_TEAMS;
  let h='<div class="s-header"><h1>CBA篮球1v1</h1><p>选择球员 · 单挑对决</p></div>';
  h+='<div class="versus">';
  h+=renderPlayerCard(player1,1,'挑战者');
  h+='<div class="vs-badge">VS</div>';
  h+=renderPlayerCard(player2,2,'防守者');
  h+='</div>';
  h+=`<div class="s-hint">为 ${selectingFor===1?'挑战者':'防守者'} 选择球员</div>`;
  h+='<div class="team-scroll">';
  teams.forEach(t=>{h+=`<div class="t-chip${t.id===currentTeamId?' active':''}" onclick="selectTeam('${t.id}')" style="border-color:${t.color}">${t.abbr}</div>`});
  h+='</div><div id="playerList">';
  const players=getPlayersByTeam(currentTeamId);
  players.forEach(p=>{
    h+=`<div class="p-card${p.id===selectedPid?' sel':''}" onclick="selectPlayer('${p.id}')" style="border-left:4px solid ${p.teamColor}">`;
    h+=`<div class="cl"><span class="num">#${p.num}</span><span class="name">${p.name}</span><span class="pos">${p.pos}</span></div>`;
    h+='<div class="ms">';
    ATTR_KEYS.forEach(k=>{h+=`<span>${k[0]}${p[k]}</span>`});
    h+='</div></div>';
  });
  h+='</div>';
  h+=`<button id="startBtn" class="${player1&&player2?'ready':''}" onclick="startGame()">${player1&&player2?'开始比赛':'请选择双方球员'}</button>`;
  selectPage.innerHTML=h;
}
function renderPlayerCard(p,idx,label){
  if(!p)return `<div class="pick"><div class="pick-head"><span class="lbl">${label}</span><span class="nm ph">选择球员</span></div></div>`;
  let h=`<div class="pick"><div class="pick-head" style="background:${p.teamColor}"><span class="lbl">${label}</span><span class="nm">${p.name}</span><span class="tm">${p.teamAbbr} #${p.num}</span></div><div class="attrs-box">`;
  ATTR_KEYS.forEach((k,i)=>{
    const v=p[k];
    h+=`<div class="attr-row"><span class="an">${ATTR_NAMES[i]}</span><div class="ab"><div style="width:${v}%;background:${v>70?'#0c6':v>40?'#fa0':'#f44'}"></div></div><span class="av">${v}</span></div>`;
  });
  h+='</div></div>';
  return h;
}
function selectTeam(id){currentTeamId=id;selectedPid='';renderSelectPage()}
function selectPlayer(pid){
  const players=getPlayersByTeam(currentTeamId);
  const p=players.find(x=>x.id===pid);if(!p)return;
  selectedPid=pid;
  if(selectingFor===1){
    player1=p;selectingFor=2;
    const nt=CBA_TEAMS.find(t=>t.id!==p.teamId)||CBA_TEAMS[0];
    currentTeamId=nt.id;selectedPid='';renderSelectPage();
  }else{player2=p;selectingFor=1;renderSelectPage()}
}

// === 进入游戏 ===
function startGame(){
  if(!player1||!player2)return;
  selectPage.style.display='none';
  gamePage.style.display='flex';resultPage.style.display='none';
  resizeCanvas();
  engine=new GameEngine(canvas.width,canvas.height);
  engine.bgImage=bgImage;
  engine.setPlayers(player1,player2);
  gameEnded=false;
  lastTime=performance.now();
  if(gameLoop)clearInterval(gameLoop);
  gameLoop=setInterval(()=>{
    const now=performance.now(),dt=now-lastTime;lastTime=now;
    engine.update(dt);
    ctx.clearRect(0,0,canvas.width,canvas.height);
    engine.render(ctx);
    if(engine.gameOver&&!gameEnded){
      gameEnded=true;clearInterval(gameLoop);
      const wn=engine.winner===0?player1.name:player2.name;
      const ov=$('gameOverOverlay');
      ov.innerHTML=`<div class="ov-box"><h2>${wn} 获胜！</h2><div class="ov-score">${engine.score[0]} - ${engine.score[1]}</div><div class="ov-stat">${player1.name}: ${engine.stats.p1.pts}分 ${engine.stats.p1.reb||0}板 ${engine.stats.p1.blk}帽 ${engine.stats.p1.stl}断</div><div class="ov-stat">${player2.name}: ${engine.stats.p2.pts}分 ${engine.stats.p2.reb||0}板 ${engine.stats.p2.blk}帽 ${engine.stats.p2.stl}断</div><button class="ov-detail" onclick="showResult()">查看详情</button><button class="ov-again" onclick="restartGame()">再来一局</button></div>`;
      ov.classList.add('show');
    }
  },16);
}
function resizeCanvas(){
  const rect=gamePage.getBoundingClientRect();
  const ctrlH=150; // approx control height
  canvas.width=rect.width;
  canvas.height=rect.height-ctrlH;
  canvas.style.width=rect.width+'px';
  canvas.style.height=(rect.height-ctrlH)+'px';
}
function restartGame(){
  $('gameOverOverlay').classList.remove('show');
  if(gameLoop)clearInterval(gameLoop);
  engine=new GameEngine(canvas.width,canvas.height);
  engine.bgImage=bgImage;
  engine.setPlayers(player1,player2);
  gameEnded=false;lastTime=performance.now();
  gameLoop=setInterval(()=>{
    const now=performance.now(),dt=now-lastTime;lastTime=now;
    engine.update(dt);
    ctx.clearRect(0,0,canvas.width,canvas.height);
    engine.render(ctx);
    if(engine.gameOver&&!gameEnded){
      gameEnded=true;clearInterval(gameLoop);
      const wn=engine.winner===0?player1.name:player2.name;
      const ov=$('gameOverOverlay');
      ov.innerHTML=`<div class="ov-box"><h2>${wn} 获胜！</h2><div class="ov-score">${engine.score[0]} - ${engine.score[1]}</div><div class="ov-stat">${player1.name}: ${engine.stats.p1.pts}分 ${engine.stats.p1.reb||0}板 ${engine.stats.p1.blk}帽 ${engine.stats.p1.stl}断</div><div class="ov-stat">${player2.name}: ${engine.stats.p2.pts}分 ${engine.stats.p2.reb||0}板 ${engine.stats.p2.blk}帽 ${engine.stats.p2.stl}断</div><button class="ov-detail" onclick="showResult()">查看详情</button><button class="ov-again" onclick="restartGame()">再来一局</button></div>`;
      ov.classList.add('show');
    }
  },16);
}

// === 结果页 ===
function showResult(){
  $('gameOverOverlay').classList.remove('show');
  gamePage.style.display='none';selectPage.style.display='none';
  resultPage.style.display='flex';resultPage.classList.add('show');
  const s=engine.stats,w=engine.winner,sc=engine.score;
  let h='<div class="r-head"><span class="trophy">🏆</span>';
  h+=`<h2>${w===0?player1.name:player2.name} 获胜！</h2><div class="r-score">${sc[0]} - ${sc[1]}</div></div>`;
  h+='<div class="r-compare">';
  h+=renderResultPlayer(player1,s.p1,w===0);
  h+=renderResultPlayer(player2,s.p2,w===1);
  h+='</div>';
  h+='<div class="attr-section"><h3>球员能力对比</h3>';
  ATTR_KEYS.forEach((k,i)=>{
    h+=`<div class="ac-row"><div class="ac-labels"><span>${player1.name}</span><span>${ATTR_NAMES[i]}</span><span>${player2.name}</span></div>`;
    h+=`<div class="ac-bars">`;
    h+=`<div class="ac-bar l" style="width:${player1[k]/1.8}%;background:${player1.teamColor};flex:none"></div>`;
    h+=`<span class="ac-mid">${player1[k]}-${player2[k]}</span>`;
    h+=`<div class="ac-bar r" style="width:${player2[k]/1.8}%;background:${player2.teamColor};flex:none"></div>`;
    h+=`</div></div>`;
  });
  h+='</div>';
  h+='<div class="r-btns"><button class="r-rematch" onclick="goRematch()">再来一局</button><button class="r-home" onclick="goHome()">返回首页</button></div>';
  resultPage.innerHTML=h;
}
function renderResultPlayer(p,stats,isWin){
  let h=`<div class="r-player${isWin?' w':''}"><div class="rn">${p.name}</div><div class="rt">${p.teamAbbr} #${p.num}</div><div class="r-stats">`;
  h+=`<div class="rs"><div class="rsv">${stats.pts}</div><div class="rsl">得分</div></div>`;
  h+=`<div class="rs"><div class="rsv">${stats.blk}</div><div class="rsl">盖帽</div></div>`;
  h+=`<div class="rs"><div class="rsv">${stats.stl}</div><div class="rsl">抢断</div></div>`;
  h+=`<div class="rs"><div class="rsv">${stats.reb||0}</div><div class="rsl">篮板</div></div>`;
  h+='</div></div>';return h;
}
function goRematch(){
  resultPage.style.display='none';resultPage.classList.remove('show');
  gamePage.style.display='flex';
  resizeCanvas();restartGame();
}
function goHome(){
  resultPage.style.display='none';resultPage.classList.remove('show');
  gamePage.style.display='none';selectPage.style.display='flex';
  if(gameLoop)clearInterval(gameLoop);
  player1=null;player2=null;selectingFor=1;currentTeamId='liaoning';selectedPid='';
  renderSelectPage();
}

// === 触控：摇杆 ===
const joyBase=$('joyBase'),joyThumb=$('joyThumb');
let joyActive=false,joyRect=null;
function getJoyRect(){
  const r=joyBase.getBoundingClientRect();
  joyRect={cx:r.left+r.width/2,cy:r.top+r.height/2,mr:r.width/2};
}
joyBase.addEventListener('touchstart',e=>{e.preventDefault();joyActive=true;getJoyRect();procJoy(e.touches[0])},{passive:false});
joyBase.addEventListener('touchmove',e=>{e.preventDefault();if(!joyActive)return;procJoy(e.touches[0])},{passive:false});
joyBase.addEventListener('touchend',e=>{e.preventDefault();joyActive=false;joyRect=null;joyThumb.style.left='50%';joyThumb.style.top='50%';if(engine)engine.offInput.mx=engine.offInput.my=0});
function procJoy(t){
  if(!joyRect)return;
  let dx=t.clientX-joyRect.cx,dy=t.clientY-joyRect.cy;
  const dist=Math.sqrt(dx*dx+dy*dy);
  if(dist>joyRect.mr){dx=dx/dist*joyRect.mr;dy=dy/dist*joyRect.mr}
  const jx=dx/joyRect.mr,jy=dy/joyRect.mr;
  joyThumb.style.left=(jx*50+50)+'%';joyThumb.style.top=(jy*50+50)+'%';
  if(engine){engine.offInput.mx=jx;engine.offInput.my=jy}
}

// === 触控：按钮 ===

btnShoot.addEventListener('touchstart',e=>{e.preventDefault();btnShoot.classList.add('active');shootLabel.textContent='松手!';if(engine)engine.startShoot()});
btnShoot.addEventListener('touchend',e=>{e.preventDefault();btnShoot.classList.remove('active');shootLabel.textContent='投篮';if(engine)engine.releaseShoot()});

btnShoot.addEventListener('mouseup',e=>{btnShoot.classList.remove('active');shootLabel.textContent='投篮';if(engine)engine.releaseShoot()});

btnDrive.addEventListener('touchstart',e=>{e.preventDefault();btnDrive.classList.add('active');if(engine)engine.drive();setTimeout(()=>btnDrive.classList.remove('active'),600)});
btnSteal.addEventListener('touchstart',e=>{e.preventDefault();btnSteal.classList.add('active');if(engine)engine.steal();setTimeout(()=>btnSteal.classList.remove('active'),400)});
btnBlock.addEventListener('touchstart',e=>{e.preventDefault();btnBlock.classList.add('active');if(engine)engine.block();setTimeout(()=>btnBlock.classList.remove('active'),500)});
btnFoul.addEventListener('touchstart',e=>{e.preventDefault();btnFoul.classList.add('active');if(engine)engine.foul();setTimeout(()=>btnFoul.classList.remove('active'),500)});

btnBlock.addEventListener('mousedown',e=>{btnBlock.classList.add('active');if(engine)engine.block();setTimeout(()=>btnBlock.classList.remove('active'),500)});

// === 窗口缩放 ===
window.addEventListener('resize',()=>{if(gamePage.style.display==='flex')resizeCanvas()});

// === Hook: 包装renderSelectPage ===
(function(){
  var orig=renderSelectPage;
  renderSelectPage=function(){
    orig();
    if(GAME_MODE==='online'){
      var h=$('selectPage').innerHTML;
      var tag=wsConnected?'<span class="stag on">已连接</span>':'<span class="stag off">未连接</span>';
      var connBar='<div class="conn-inline" style="padding:4px 8px;justify-content:center"><input id="srvInp" placeholder="服务器地址"><button onclick="doConn()">连接</button>'+tag+'</div>';
      h=h.replace('</div><div class="team-scroll">','</div>'+connBar+'<div class="team-scroll">');
      if(isQueuing){h=h.replace('选择球员 · 单挑对决','匹配中... <span class="q-badge">寻找对手</span>')}
      $('selectPage').innerHTML=h;
    }
  };
  // 启动按钮hook
  var origStart=startGame;
  startGame=function(){
    if(GAME_MODE==='online'){
      if(!player1||!wsConnected)return;
      sendMsg({type:'join_queue',name:player1.name,player:{id:player1.id,name:player1.name,num:player1.num,pos:player1.pos,shooting:player1.shooting,speed:player1.speed,strength:player1.strength,defense:player1.defense,dribbling:player1.dribbling,jumping:player1.jumping,teamColor:player1.teamColor,teamAbbr:player1.teamAbbr}});
      isQueuing=true;renderSelectPage();return;
    }
    initOnlineBtns();origStart();
  };
  // restartGame hook
  var origRestart=restartGame;
  restartGame=function(){
    if(GAME_MODE==='online'){$('gameOverOverlay').classList.remove('show');startOnlineGame();return;}
    origRestart();
  };
})();

// === 启动 ===
showModePage();
