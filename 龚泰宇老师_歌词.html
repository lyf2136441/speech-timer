<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>龚泰宇老师，我还记得你</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #0c0c1d 0%, #1a1a3e 40%, #2d1b4e 70%, #1a1a3e 100%);
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Serif SC", serif;
    overflow: hidden;
  }

  /* 星星背景 */
  .stars {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
  }
  .star {
    position: absolute;
    background: white;
    border-radius: 50%;
    animation: twinkle var(--dur) ease-in-out infinite;
    animation-delay: var(--delay);
    opacity: 0;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.2; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.5); }
  }

  /* 主内容 */
  .container {
    position: relative;
    z-index: 1;
    text-align: center;
    padding: 60px 40px;
    max-width: 800px;
  }

  /* 装饰线 */
  .ornament {
    width: 60px;
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
    margin: 0 auto 40px;
  }

  .lyrics {
    display: flex;
    flex-direction: column;
    gap: 32px;
  }

  .line {
    font-size: 2.8rem;
    color: #e8d5f5;
    letter-spacing: 0.15em;
    text-shadow: 0 0 40px rgba(180, 140, 220, 0.5), 0 0 80px rgba(180, 140, 220, 0.2);
    animation: fadeIn 1.5s ease-out forwards;
    opacity: 0;
    line-height: 1.8;
  }
  .line:first-child { animation-delay: 0.3s; }
  .line:last-child  { animation-delay: 0.9s; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* 底部光晕 */
  .glow {
    position: fixed;
    bottom: 20%;
    left: 50%;
    transform: translateX(-50%);
    width: 400px;
    height: 200px;
    background: radial-gradient(ellipse, rgba(140, 100, 200, 0.15) 0%, transparent 70%);
    pointer-events: none;
  }
</style>
</head>
<body>

<div class="stars" id="stars"></div>
<div class="glow"></div>

<div class="container">
  <div class="ornament"></div>
  <div class="lyrics">
    <div class="line">龚泰宇老师</div>
    <div class="line">我还记得你</div>
  </div>
  <div class="ornament" style="margin-top: 40px;"></div>
</div>

<script>
// 生成星星
const starsEl = document.getElementById('stars');
for (let i = 0; i < 60; i++) {
  const star = document.createElement('div');
  star.className = 'star';
  const size = Math.random() * 2.5 + 0.5;
  star.style.cssText = `
    width: ${size}px;
    height: ${size}px;
    left: ${Math.random() * 100}%;
    top: ${Math.random() * 100}%;
    --dur: ${Math.random() * 2 + 1.5}s;
    --delay: ${Math.random() * 3}s;
  `;
  starsEl.appendChild(star);
}
</script>

</body>
</html>
