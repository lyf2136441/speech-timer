<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover, maximum-scale=1.0">
<title>CBA篮球1v1联机</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
body{background:#0f0f1a;overflow:hidden;touch-action:manipulation;font-family:-apple-system,sans-serif;width:100vw;height:100vh;height:100dvh}
#app{width:100%;height:100%;position:relative}

/* 选人页 = 和单机版一致 */
#selectPage{position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;z-index:10;overflow-y:auto}
.s-header{text-align:center;padding:16px 0 8px;flex-shrink:0}
.s-header h1{font-size:24px;color:#ff8c00;letter-spacing:2px;font-weight:900}
.s-header p{font-size:12px;color:#888;margin-top:2px}
.conn-row{display:flex;align-items:center;justify-content:center;gap:8px;padding:4px 16px;flex-shrink:0}
.conn-row input{flex:1;max-width:200px;height:32px;background:#111;border:1px solid #333;border-radius:6px;color:#fff;padding:0 10px;font-size:13px}
.conn-row button{height:32px;padding:0 14px;border-radius:6px;border:none;font-size:12px;font-weight:bold;background:#ff8c00;color:#000;white-space:nowrap}
.stag{font-size:10px;padding:3px 10px;border-radius:10px;font-weight:bold}
.stag.on{background:#0a3;color:#fff}
.stag.off{background:#a30;color:#fff}
.versus{display:flex;align-items:flex-start;padding:0 4px;flex-shrink:0}
.pick{flex:1;background:#1a1a2e;border-radius:12px;overflow:hidden;min-height:140px}
.pick-head{padding:10px;text-align:center;color:#fff}
.pick-head .lbl{font-size:11px;opacity:.7}
.pick-head .nm{font-size:18px;font-weight:bold;margin:2px 0}
.pick-head .tm{font-size:11px;opacity:.6}
.pick-head .ph{font-size:14px;opacity:.3;font-weight:normal}
.attrs-box{padding:6px 10px}
.attr-row{display:flex;align-items:center;margin-bottom:4px}
.attr-row .an{width:30px;font-size:10px;color:#aaa;flex-shrink:0}
.attr-row .ab{flex:1;height:5px;background:#333;border-radius:3px;margin:0 4px;overflow:hidden}
.attr-row .ab div{height:100%;border-radius:3px}
.attr-row .av{width:22px;font-size:10px;color:#fff;text-align:right}
.vs-badge{display:flex;align-items:center;justify-content:center;width:40px;flex-shrink:0;padding-top:50px;font-size:22px;font-weight:bold;color:#ff4444}
.s-hint{text-align:center;padding:6px;font-size:13px;color:#ff8c00;flex-shrink:0}
.team-scroll{display:flex;overflow-x:auto;padding:6px 8px;gap:8px;flex-shrink:0;-webkit-overflow-scrolling:touch}
.team-scroll::-webkit-scrollbar{display:none}
.t-chip{border:2px solid #333;border-radius:16px;padding:6px 14px;font-size:12px;color:#aaa;white-space:nowrap;flex-shrink:0;cursor:pointer}
.t-chip.active{color:#fff;background:#2a2a4e}
#playerList{flex:1;overflow-y:auto;background:#1a1a2e;margin:0 4px;border-radius:10px;-webkit-overflow-scrolling:touch}
.p-card{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid rgba(255,255,255,.04);cursor:pointer}
.p-card.sel{background:rgba(255,140,0,.12)}
.p-card .cl{display:flex;align-items:center;gap:10px}
.p-card .num{font-size:16px;font-weight:bold;color:#ff8c00;width:40px}
.p-card .name{font-size:15px;color:#fff;width:90px}
.p-card .pos{font-size:11px;color:#888;background:#2a2a4e;padding:2px 8px;border-radius:6px}
.p-card .ms{display:flex;flex-wrap:wrap;gap:4px;font-size:9px;color:#999}
.p-card .ms span{background:#222;padding:1px 5px;border-radius:4px}
#startBtn{height:50px;background:#333;color:#888;border:none;border-radius:25px;font-size:18px;font-weight:bold;pointer-events:none;transition:all .3s;margin:10px 16px;flex-shrink:0;padding:0}
#startBtn.ready{background:linear-gradient(135deg,#ff8c00,#ff4444);color:#fff;pointer-events:auto;box-shadow:0 4px 20px rgba(255,68,68,.4)}

/* 排队状态 */
.q-overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:50}
.q-overlay.show{display:flex}
.q-icon{font-size:64px;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
.q-text{font-size:20px;color:#ff8c00;margin-top:16px}
.q-sub{font-size:13px;color:#888;margin-top:4px}
.q-cancel{height:40px;padding:0 30px;border-radius:20px;border:none;background:#a30;color:#fff;font-size:14px;margin-top:20px}

/* 倒计时覆盖 */
#countdownOverlay{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.75);display:none;align-items:center;justify-content:center;z-index:100;flex-direction:column}
#countdownOverlay.show{display:flex}
.cd-num{font-size:90px;font-weight:bold;color:#ffd700}
.cd-opp{font-size:16px;color:#fff;margin-top:4px}

/* 游戏页 */
#gamePage{position:absolute;top:0;left:0;right:0;bottom:0;display:none;flex-direction:column;z-index:20}
#gameCanvas{flex:1;width:100%;display:block}
.ctrls{display:flex;justify-content:space-between;align-items:flex-end;padding:6px 12px 20px}
.joy-wrap{display:flex;flex-direction:column;align-items:center}
.joy-base{width:100px;height:100px;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.2);border-radius:50%;position:relative}
.joy-thumb{width:44px;height:44px;background:rgba(255,140,0,.5);border-radius:50%;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.joy-label{font-size:10px;color:rgba(255,255,255,.4);margin-top:4px}
.btns{display:flex;flex-direction:column;gap:8px}
.btns-row{display:flex;gap:8px;justify-content:flex-end}
.btn{width:80px;height:70px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;border:2px solid rgba(255,255,255,.12);background:rgba(255,255,255,.08);color:rgba(255,255,255,.7);transition:all .08s}
.btn:active,.btn.active{background:rgba(255,140,0,.25);border-color:#ff8c00;transform:scale(.92)}
.btn.shoot{width:100px;height:80px;background:rgba(255,68,68,.18);border-color:rgba(255,68,68,.25)}
.btn.drive{background:rgba(0,136,255,.15);border-color:rgba(0,136,255,.2)}
.btn.steal{background:rgba(255,200,0,.12);border-color:rgba(255,200,0,.2)}
.btn.block{background:rgba(255,0,0,.12);border-color:rgba(255,0,0,.2)}
.btn.foul{background:rgba(255,68,0,.15);border-color:rgba(255,68,0,.3)}
.btn .ico{font-size:24px}
.btn .lbl{font-size:10px;margin-top:2px}

/* 游戏结束 */
.overlay{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.75);display:none;align-items:center;justify-content:center;z-index:100}
.overlay.show{display:flex}
.ov-box{background:#1a1a2e;border-radius:20px;padding:36px 32px;text-align:center;width:300px}
.ov-box h2{font-size:22px;color:#ffd700}
.ov-box .ov-score{font-size:38px;font-weight:bold;color:#fff;margin:8px 0}
.ov-box .ov-stat{font-size:12px;color:#aaa;margin:3px 0}
.ov-box button{width:100%;height:42px;border-radius:21px;border:none;font-size:15px;font-weight:bold;margin-top:8px;padding:0}
.ov-box .ov-rematch{background:linear-gradient(135deg,#ff8c00,#ff4444);color:#fff}
.ov-box .ov-home{background:rgba(255,255,255,.1);color:#ccc}
</style>
</head>

</div>

function $(id){return document.getElementById(id)}

var goOverlay=$('gameOverOverlay');

var joyBase=$('joyBase'),joyThumb=$('joyThumb');

// ====== WebSocket ======
function getAutoUrl(){var p=window.location.protocol==='https:'?'wss:':'ws:';return p+'//'+window.location.host}
function connectWS(url){
  if(ws){try{ws.close()}catch(e){}}
  var u=url||getAutoUrl();if(u.indexOf('://')===-1)u='ws://'+u;
  ws=new WebSocket(u);
  ws.onopen=function(){wsConnected=true;myInput={mx:0,my:0};renderSelect();};
  ws.onmessage=function(e){handleMsg(JSON.parse(e.data))};
  ws.onclose=function(){wsConnected=false;if(gameStarted)goHome();renderSelect();};
  ws.onerror=function(){wsConnected=false;renderSelect();};
}
function send(d){if(ws&&ws.readyState===WebSocket.OPEN)ws.send(JSON.stringify(d))}

// ====== 消息处理 ======
function handleMsg(msg){
  switch(msg.type){
    case 'connected':myId=msg.playerId;renderSelect();break;
    case 'queued':isQueuing=true;renderSelect();break;
    case 'queue_left':isQueuing=false;renderSelect();break;
    case 'matched':
      roomId=msg.roomId;mySide=msg.side;
      playerOpp=msg.opponent.player||msg.opponent;
      cdOpp.textContent='VS '+playerOpp.name;
      cdOverlay.classList.add('show');cdNum.textContent='3';
      break;
    case 'jump_countdown':
      cdNum.textContent=msg.count>0?msg.count:'GO!';break;
    case 'game_start':
      cdOverlay.classList.remove('show');startGame();break;
    case 'state_sync':gameState=msg.state;break;
    case 'score_update':
      if(gameState){gameState.sc=msg.score;gameState.st=msg.stats;}break;
    case 'possession_change':
      if(gameState){gameState.po=msg.poss;gameState.sc=msg.score;}break;
    case 'foul_called':
      if(gameState){gameState.ph='freethrow';gameState.fts=msg.shooter;}break;
    case 'game_over':showGameOver(msg);break;
    case 'opponent_disconnected':alert('对手已断开！');goHome();break;
    case 'rematch_vote':break;
    case 'rematch_start':gameState=null;goOverlay.classList.remove('show');cdOverlay.classList.add('show');cdNum.textContent='3';break;
    case 'leaderboard':break;
    case 'pong':break;
  }
}

// ====== 选人页 ======
function renderPlayerCard(p,label){
  if(!p)return '<div class="pick"><div class="pick-head"><span class="lbl">'+label+'</span><span class="nm ph">选择球员</span></div></div>';
  var h='<div class="pick"><div class="pick-head" style="background:'+p.teamColor+'"><span class="lbl">'+label+'</span><span class="nm">'+p.name+'</span><span class="tm">'+p.teamAbbr+' #'+p.num+'</span></div><div class="attrs-box">';
  ATTR_KEYS.forEach(function(k,i){var v=p[k];
    h+='<div class="attr-row"><span class="an">'+ATTR_NAMES[i]+'</span><div class="ab"><div style="width:'+v+'%;background:'+(v>70?'#0c6':v>40?'#fa0':'#f44')+'"></div></div><span class="av">'+v+'</span></div>';
  });
  return h+'</div></div>';
}

function renderSelect(){
  var h='<div class="s-header"><h1>🏀 CBA篮球1v1</h1><p>联机对战 · 选球员 · 匹配对手</p></div>';
  // Connection status
  var tag=wsConnected?'<span class="stag on">已连接</span>':'<span class="stag off">未连接</span>';
  h+='<div class="conn-row"><input id="serverInp" placeholder="服务器地址" value="'+getAutoUrl().replace('ws','http')+'">';
  h+='<button onclick="doConn()">连接</button>'+tag+'</div>';

  // VS
  h+='<div class="versus">';
  h+=renderPlayerCard(playerMe,'我方球员');
  h+='<div class="vs-badge">VS</div>';
  h+=renderPlayerCard(isQueuing&&playerOpp?playerOpp:null,'对手');
  h+='</div>';

  if(isQueuing){
    h+='<div class="s-hint">🔍 正在匹配对手...</div>';
  }else if(playerMe){
    h+='<div class="s-hint">已选择: '+playerMe.name+' | 点下方按钮开始匹配</div>';
  }else{
    h+='<div class="s-hint">选择你的球员</div>';
  }

  // Team chips
  h+='<div class="team-scroll">';
  CBA.forEach(function(t){h+='<div class="t-chip'+(t.id===currentTeamId?' active':'')+'" onclick="pickTeam(\''+t.id+'\')" style="border-color:'+t.color+'">'+t.abbr+'</div>'});
  h+='</div>';

  // Player list
  h+='<div id="playerList">';
  getPlayers(currentTeamId).forEach(function(p){
    h+='<div class="p-card'+(p.id===selectedPid?' sel':'')+'" onclick="pickPlayer(\''+p.id+'\')" style="border-left:4px solid '+p.teamColor+'">';
    h+='<div class="cl"><span class="num">#'+p.num+'</span><span class="name">'+p.name+'</span><span class="pos">'+p.pos+'</span></div>';
    h+='<div class="ms">';ATTR_KEYS.forEach(function(k){h+='<span>'+k[0]+p[k]+'</span>'});h+='</div></div>';
  });
  h+='</div>';

  // Action button
  if(isQueuing){
    h+='<button id="startBtn" class="ready" onclick="cancelQ()">取消排队</button>';
  }else{
    h+='<button id="startBtn" class="'+(playerMe&&wsConnected?'ready':'')+'" onclick="startMatch()">'+(playerMe&&wsConnected?'开始匹配':'请选择球员并连接服务器')+'</button>';
  }

  selectPage.innerHTML=h;
}

function pickTeam(id){currentTeamId=id;selectedPid='';renderSelect()}
function pickPlayer(pid){
  var pl=getPlayers(currentTeamId);var p=pl.find(function(x){return x.id===pid});if(!p)return;
  selectedPid=pid;playerMe=p;renderSelect();
}
function doConn(){var addr=$('serverInp').value.trim();if(!addr)return;if(addr.indexOf('://')>0)addr=addr.split('://')[1];if(addr.indexOf(':')===-1)addr+=':3456';connectWS(addr)}
function startMatch(){
  if(!playerMe||!wsConnected)return;
  send({type:'join_queue',name:playerMe.name,player:{id:playerMe.id,name:playerMe.name,num:playerMe.num,pos:playerMe.pos,shooting:playerMe.shooting,speed:playerMe.speed,strength:playerMe.strength,defense:playerMe.defense,dribbling:playerMe.dribbling,jumping:playerMe.jumping,teamColor:playerMe.teamColor,teamAbbr:playerMe.teamAbbr}});
  isQueuing=true;renderSelect();
}
function cancelQ(){send({type:'leave_queue'});isQueuing=false;renderSelect()}

// ====== 游戏 ======
function startGame(){
  selectPage.style.display='none';gamePage.style.display='flex';goOverlay.classList.remove('show');
  canvas=$('gameCanvas');ctx=canvas.getContext('2d');resizeCanvas();gameStarted=true;
  if(gameLoop)clearInterval(gameLoop);
  gameLoop=setInterval(function(){sendInput();renderGame();},33);
}
function resizeCanvas(){
  var r=gamePage.getBoundingClientRect();
  canvas.width=r.width;canvas.height=r.height-150;
  canvas.style.width=r.width+'px';canvas.style.height=(r.height-150)+'px';
}
function sendInput(){
  if(!wsConnected||!gameState)return;
  send({type:'input',data:{action:'move',mx:myInput.mx,my:myInput.my}});
}
window.addEventListener('resize',function(){if(gamePage.style.display==='flex')resizeCanvas()});

// ====== 渲染(和单机版一致的侧视角球场) ======
function renderGame(){
  if(!ctx||!canvas)return;
  var w=canvas.width,h=canvas.height,s=gameState;
  var sc=Math.min(w/750,h/500);
  function _(v){return v*sc}
  ctx.clearRect(0,0,w,h);

  // Court floor
  ctx.fillStyle='#c68642';ctx.fillRect(0,0,w,h);
  ctx.strokeStyle='rgba(180,130,80,0.2)';ctx.lineWidth=1;
  for(var y=0;y<h;y+=_(25)){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}

  var rx=_(375),ry=_(60);
  // Backboard
  ctx.fillStyle='#ddd';ctx.fillRect(rx-_(50),ry-_(20),_(100),_(8));
  // Rim
  ctx.strokeStyle='#ff4444';ctx.lineWidth=3;
  ctx.beginPath();ctx.arc(rx,ry,_(12),0,Math.PI*2);ctx.stroke();
  // Net
  ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=0.5;
  for(var i=0;i<4;i++){ctx.beginPath();ctx.moveTo(rx+Math.cos(-1.9+i*0.25)*_(10),ry+Math.sin(-1.9+i*0.25)*_(10));ctx.lineTo(rx,_(28)+ry);ctx.stroke()}
  // 3pt arc
  ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(rx,ry,_(280),Math.PI*0.5,Math.PI*1.5);ctx.stroke();
  // Paint
  var pw=_(160),ph=_(200);
  ctx.fillStyle='#b87a3a';ctx.fillRect(rx-pw/2,ry,pw,ph);
  ctx.strokeStyle='#fff';ctx.strokeRect(rx-pw/2,ry,pw,ph);
  ctx.beginPath();ctx.moveTo(rx-pw/2,ry+ph);ctx.lineTo(rx+pw/2,ry+ph);ctx.stroke();
  // Center
  ctx.beginPath();ctx.arc(rx,h-_(20),_(50),0,Math.PI);ctx.stroke();

  if(!s){
    ctx.fillStyle='#fff';ctx.font='bold '+_(16)+'px sans-serif';ctx.textAlign='center';
    ctx.fillText('等待对手连接...',w/2,h/2);return;
  }

  // Helper
  function drawP(px,py,data,color,label){
    if(!data)return;
    var x=_(px),y=_(py),r=_(25);
    ctx.fillStyle='rgba(0,0,0,0.3)';ctx.beginPath();ctx.ellipse(x,y+r*0.9,r*0.8,r*0.2,0,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=color;ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle='#fff';ctx.font='bold '+Math.floor(r*0.8)+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(data.num||'?',x,y);
    ctx.font=Math.floor(r*0.45)+'px sans-serif';ctx.fillText(data.name||'',x,y-r-_(8));
    if(label){ctx.fillStyle=label==='攻'||label==='罚'?'#ff0':'#f88';ctx.font='bold '+Math.floor(r*0.45)+'px sans-serif';ctx.fillText(label,x,y+r+_(10))}
  }

  var p1d=mySide===0?playerMe:playerOpp,p2d=mySide===1?playerMe:playerOpp;
  if(s.ph==='freethrow'){
    drawP(s.p1.x,s.p1.y,p1d,'#1a6dd4',s.fts===0?'罚':'');
    drawP(s.p2.x,s.p2.y,p2d,'#e03030',s.fts===1?'罚':'');
  }else{
    drawP(s.p1.x,s.p1.y,p1d,'#1a6dd4',s.po===0?'攻':'守');
    drawP(s.p2.x,s.p2.y,p2d,'#e03030',s.po===1?'攻':'守');
  }

  // Ball
  if(!s.ba.ps||s.ba.ia){
    var bx=_(s.ba.x),by=_(s.ba.y),br=_(10);
    ctx.fillStyle='#ff8c00';ctx.beginPath();ctx.arc(bx,by,br,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#cc6600';ctx.lineWidth=1.5;ctx.stroke();
    ctx.strokeStyle='#333';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(bx-br,by);ctx.lineTo(bx+br,by);ctx.stroke();
    ctx.beginPath();ctx.arc(bx,by,br*0.5,0,Math.PI*2);ctx.stroke();
  }

  // Top bar
  ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,w,_(44));
  var p1n=p1d?p1d.name:'P1',p2n=p2d?p2d.name:'P2';
  ctx.fillStyle='#1a6dd4';ctx.font='bold '+Math.floor(_(13))+'px sans-serif';ctx.textAlign='center';
  ctx.fillText(p1n,w*0.2,_(18));
  ctx.fillStyle='#fff';ctx.font='bold '+Math.floor(_(18))+'px sans-serif';
  ctx.fillText((s.sc?+s.sc[0]:0)+' - '+(s.sc?+s.sc[1]:0),w/2,_(18));
  ctx.fillStyle='#e03030';ctx.font='bold '+Math.floor(_(13))+'px sans-serif';
  ctx.fillText(p2n,w*0.8,_(18));
  ctx.fillStyle=s.cl<=5?'#ff4444':'#fff';ctx.font='bold '+Math.floor(_(11))+'px sans-serif';
  ctx.fillText((s.cl||24)+'s',w-_(28),_(18));

  var phaseText=s.ph==='freethrow'?'罚球: '+(s.fts===0?p1n:p2n)+' ('+(s.ftm||0)+'/2)':s.ph==='jumpball'?'跳球中...':'球权: '+(s.po===0?p1n:p2n);
  ctx.fillStyle='rgba(255,255,255,0.5)';ctx.font=Math.floor(_(10))+'px sans-serif';ctx.textAlign='center';
  ctx.fillText(phaseText,w/2,_(34));

  // 3pt warning
  if(s.nct&&!s.ctd){ctx.fillStyle='#ff0';ctx.font='bold '+Math.floor(_(14))+'px sans-serif';ctx.textAlign='center';ctx.fillText('⚠ 需运球出三分线！',w/2,_(65))}

  // Shot power bar
  if(s.sh){
    var bw=_(180),bh=_(10),bx2=w/2-bw/2,by2=h-_(90);
    ctx.fillStyle='#333';ctx.fillRect(bx2,by2,bw,bh);
    ctx.fillStyle='rgba(0,255,0,0.3)';ctx.fillRect(bx2+bw*0.45,by2,bw*0.1,bh);
    var p=s.sp||0,mc=p>=.45&&p<=.55?'#00ff00':p>=.35&&p<=.65?'#ffff00':'#ff0000';
    ctx.fillStyle=mc;ctx.fillRect(bx2,by2,bw*p,bh);
    ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.strokeRect(bx2,by2,bw,bh);
    ctx.fillStyle='#fff';ctx.font='bold '+Math.floor(_(11))+'px sans-serif';ctx.textAlign='center';
    ctx.fillText((s.ph==='freethrow'?'罚球':'投篮')+' 力度 '+Math.floor(p*100)+'%',w/2,by2-_(6));
  }

  // Score pop
  if(s.san>0&&s.spt>0){ctx.fillStyle='rgba(255,255,0,'+Math.min(1,s.san/800)+')';ctx.font='bold '+Math.floor(_(22))+'px sans-serif';ctx.textAlign='center';ctx.fillText('+'+s.spt,w/2,_(150))}

  // Energy
  var ey=_(48),eh=_(5),ew=_(70);
  ctx.fillStyle='#333';ctx.fillRect(_(10),ey,ew,eh);ctx.fillStyle='#0cf';ctx.fillRect(_(10),ey,ew*((s.p1.e||100)/100),eh);
  ctx.fillStyle='#333';ctx.fillRect(w-_(10)-ew,ey,ew,eh);ctx.fillStyle='#0cf';ctx.fillRect(w-_(10)-ew,ey,ew*((s.p2.e||100)/100),eh);

  // Foul CD
  if(s.fcd&&s.fcd[mySide]>0){ctx.fillStyle='rgba(255,68,0,0.5)';ctx.font=Math.floor(_(10))+'px sans-serif';ctx.textAlign='center';ctx.fillText('犯规冷却'+(s.fcd[mySide]/1000).toFixed(1)+'s',w-_(50),_(60))}

  // Events
  if(s.ev&&s.ev.length>0){ctx.fillStyle='rgba(255,255,255,0.7)';ctx.font=Math.floor(_(11))+'px sans-serif';ctx.textAlign='right';ctx.fillText(s.ev[s.ev.length-1],w-_(10),h-_(100))}
}

// ====== 触控 ======
// Joystick
var joyActive=false,joyRect=null;
function getJoyR(){var r=joyBase.getBoundingClientRect();joyRect={cx:r.left+r.width/2,cy:r.top+r.height/2,mr:r.width/2}}
joyBase.addEventListener('touchstart',function(e){e.preventDefault();joyActive=true;getJoyR();procJ(e.touches[0])},{passive:false});
joyBase.addEventListener('touchmove',function(e){e.preventDefault();if(!joyActive)return;procJ(e.touches[0])},{passive:false});
joyBase.addEventListener('touchend',function(e){e.preventDefault();joyActive=false;joyRect=null;joyThumb.style.left='50%';joyThumb.style.top='50%';myInput.mx=0;myInput.my=0});
function procJ(t){if(!joyRect)return;var dx=t.clientX-joyRect.cx,dy=t.clientY-joyRect.cy;var d=Math.sqrt(dx*dx+dy*dy);if(d>joyRect.mr){dx=dx/d*joyRect.mr;dy=dy/d*joyRect.mr}var jx=dx/joyRect.mr,jy=dy/joyRect.mr;joyThumb.style.left=(jx*50+50)+'%';joyThumb.style.top=(jy*50+50)+'%';myInput.mx=jx;myInput.my=jy}

// Buttons
btnShoot.addEventListener('touchstart',function(e){e.preventDefault();btnShoot.classList.add('active');shootLabel.textContent='松手!';send({type:'input',data:{action:'shoot_start'}})});
btnShoot.addEventListener('touchend',function(e){e.preventDefault();btnShoot.classList.remove('active');shootLabel.textContent='投篮';send({type:'input',data:{action:'shoot_release'}})});
btnShoot.addEventListener('mousedown',function(){btnShoot.classList.add('active');shootLabel.textContent='松手!';send({type:'input',data:{action:'shoot_start'}})});
btnShoot.addEventListener('mouseup',function(){btnShoot.classList.remove('active');shootLabel.textContent='投篮';send({type:'input',data:{action:'shoot_release'}})});
function bindBtn(id,act){var b=$(id);b.addEventListener('touchstart',function(e){e.preventDefault();b.classList.add('active');send({type:'input',data:{action:act}});setTimeout(function(){b.classList.remove('active')},400)});b.addEventListener('mousedown',function(){b.classList.add('active');send({type:'input',data:{action:act}});setTimeout(function(){b.classList.remove('active')},400)})}
bindBtn('btnDrive','drive');bindBtn('btnSteal','steal');bindBtn('btnBlock','block');bindBtn('btnFoul','foul');

// ====== 结束 ======
function showGameOver(msg){
  if(gameLoop){clearInterval(gameLoop);gameLoop=null}gameStarted=false;
  var p1n=playerMe?playerMe.name:'我方',p2n=playerOpp?(playerOpp.name||'对手'):'对手';
  goOverlay.innerHTML='<div class="ov-box"><h2>'+msg.winner.name+' 获胜！</h2><div class="ov-score">'+msg.score[0]+' - '+msg.score[1]+'</div><div class="ov-stat">'+p1n+': '+(msg.stats.p1?msg.stats.p1.pts:0)+'分 '+(msg.stats.p1?msg.stats.p1.reb||0:0)+'板 '+(msg.stats.p1?msg.stats.p1.blk:0)+'帽 '+(msg.stats.p1?msg.stats.p1.stl:0)+'断</div><div class="ov-stat">'+p2n+': '+(msg.stats.p2?msg.stats.p2.pts:0)+'分 '+(msg.stats.p2?msg.stats.p2.reb||0:0)+'板 '+(msg.stats.p2?msg.stats.p2.blk:0)+'帽 '+(msg.stats.p2?msg.stats.p2.stl:0)+'断</div><button class="ov-rematch" onclick="rematch()">再来一局</button><button class="ov-home" onclick="goHome()">返回首页</button></div>';
  goOverlay.classList.add('show');
}
function rematch(){send({type:'rematch_request'});goOverlay.classList.remove('show');gameState=null}
function goHome(){
  if(gameLoop){clearInterval(gameLoop);gameLoop=null}gameStarted=false;gameState=null;
  gamePage.style.display='none';goOverlay.classList.remove('show');cdOverlay.classList.remove('show');
  selectPage.style.display='flex';isQueuing=false;send({type:'leave_queue'});myInput={mx:0,my:0};
  renderSelect();
}

// ====== 启动 ======
setTimeout(function(){if(window.location.hostname!=='localhost'&&window.location.hostname!=='127.0.0.1')connectWS(getAutoUrl())},300);
renderSelect();
</script>
